name: Public provider canary

on:
  schedule:
    - cron: "17 5 * * 2,5"
  workflow_dispatch:

concurrency:
  group: public-provider-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  public-direct:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"
      - name: Restore consecutive-failure state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .paper-fetch-canary/state.json
          key: provider-canary-v1-${{ github.run_id }}
          restore-keys: |
            provider-canary-v1-
      - name: Run public direct routes
        env:
          PAPER_FETCH_RUN_PUBLIC_CANARY: "1"
        run: >-
          PYTHONPATH=src uv run python scripts/run_public_direct_canary.py
          --output .paper-fetch-canary/report.json
      - name: Update warning threshold state
        if: ${{ always() && hashFiles('.paper-fetch-canary/report.json') != '' }}
        run: >-
          uv run python scripts/update_provider_canary_state.py
          --report .paper-fetch-canary/report.json
          --state .paper-fetch-canary/state.json
      - name: Preserve canary evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-provider-canary-${{ github.run_id }}
          path: .paper-fetch-canary/
          if-no-files-found: warn
          retention-days: 30
