name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-startup-diagnosis:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.14"
          full: "true"
      - name: Prepare the same managed runtime as release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=src uv run python - <<'PYTHON'
          from pathlib import Path
          import os
          from paper_fetch.providers.browser_runtime.preparation import prepare_camoufox_managed_runtime
          from paper_fetch.providers.browser_runtime.byparr_preparation import prepare_source, PreparationBudget
          from camoufox.fpgen_model import ensure_fpgen_model
          assert prepare_camoufox_managed_runtime().valid
          ensure_fpgen_model()
          prepare_source(Path(os.environ["RUNNER_TEMP"]) / "byparr-tests", PreparationBudget(600))
          PYTHON
      - name: Reproduce native startup with child stacks
        env:
          PAPER_FETCH_TEST_BYPARR_CACHE: ${{ runner.temp }}/byparr-tests
          PYTEST_XDIST_AUTO_NUM_WORKERS: "4"
        run: >-
          PYTHONPATH=src uv run python -m pytest tests/integration/test_pnas_byparr.py
          -q --durations=10 -k 'owned_shared_session_collects_original_asset_bytes_and_cleans_processes or shared_context_modes_preserve_state_and_real_responses'
