name: CI

on:
  push:
  pull_request:
  schedule:
    # 03:17 Asia/Shanghai. Avoid the high-load start of the UTC hour.
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      run_live_mcp:
        description: "Run live MCP smoke tests"
        required: false
        default: false
        type: boolean
      run_ieee_live_mcp:
        description: "Include IEEE Xplore fulltext smoke tests; requires an authorized runner/network"
        required: false
        default: false
        type: boolean
      run_full_golden:
        description: "Run full golden corpus regression"
        required: false
        default: false
        type: boolean
      publish_release:
        description: "Publish GitHub Release with offline packages"
        required: false
        default: false
        type: boolean
      run_offline_windows_only:
        description: "Run only the Windows offline installer packaging job"
        required: false
        default: false
        type: boolean
      force_refresh:
        description: "Force a dependency-latest rebuild and rolling prerelease update"
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ (github.event_name == 'schedule' || inputs.force_refresh) && 'paper-fetch-dependency-latest' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dependency-refresh-context:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_refresh) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      source_tag: ${{ steps.source.outputs.source_tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      project_version: ${{ steps.source.outputs.project_version }}

    steps:
      - name: Resolve latest stable release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          case "$source_tag" in
            v*) ;;
            *)
              echo "Latest stable release tag must start with v: $source_tag" >&2
              exit 1
              ;;
          esac
          echo "source_tag=$source_tag" >> "$GITHUB_OUTPUT"

      - name: Refuse immutable rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/dependency-latest-release.json"
          release_error="$RUNNER_TEMP/dependency-latest-release.error"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/dependency-latest" \
            > "$release_json" 2> "$release_error"; then
            immutable="$(python3 -c 'import json, pathlib, sys; print(str(json.loads(pathlib.Path(sys.argv[1]).read_text()).get("immutable", False)).lower())' "$release_json")"
            if [ "$immutable" = "true" ]; then
              echo "dependency-latest is immutable and cannot be rolled forward." >&2
              exit 1
            fi
          elif ! grep -Fq '(HTTP 404)' "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi

      - name: Check out latest stable source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.source_tag }}
          path: stable-source
          fetch-depth: 1

      - name: Publish stable source metadata
        id: source
        env:
          SOURCE_TAG: ${{ steps.release.outputs.source_tag }}
        run: |
          set -euo pipefail
          source_sha="$(git -C stable-source rev-parse HEAD)"
          project_version="$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("stable-source/pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          echo "source_tag=$SOURCE_TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "project_version=$project_version" >> "$GITHUB_OUTPUT"

  dependency-refresh-resolve:
    needs: dependency-refresh-context
    if: ${{ needs.dependency-refresh-context.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            target: linux-x86_64-cp311
          - os: ubuntu-latest
            python-version: "3.12"
            target: linux-x86_64-cp312
          - os: ubuntu-latest
            python-version: "3.13"
            target: linux-x86_64-cp313
          - os: ubuntu-latest
            python-version: "3.14"
            target: linux-x86_64-cp314
          - os: macos-latest
            python-version: "3.11"
            target: macos-arm64-cp311
          - os: macos-latest
            python-version: "3.12"
            target: macos-arm64-cp312
          - os: macos-latest
            python-version: "3.13"
            target: macos-arm64-cp313
          - os: macos-latest
            python-version: "3.14"
            target: macos-arm64-cp314
          - os: windows-latest
            python-version: "3.13"
            target: windows-x86_64-cp313
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - name: Check out dependency refresh tooling
        uses: actions/checkout@v7

      - name: Check out latest stable source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.dependency-refresh-context.outputs.source_sha }}
          path: stable-source
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned resolver tooling
        run: python -m pip install "pip==26.1.2" "packaging==26.2"

      - name: Resolve target dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          python scripts/resolve_offline_dependencies.py resolve \
            --project-root stable-source \
            --output-dir "$RUNNER_TEMP/dependency-snapshot" \
            --target "${{ matrix.target }}" \
            --source-tag "${{ needs.dependency-refresh-context.outputs.source_tag }}" \
            --source-sha "${{ needs.dependency-refresh-context.outputs.source_sha }}"

      - name: Upload target dependency snapshot
        uses: actions/upload-artifact@v7
        with:
          name: dependency-snapshot-${{ matrix.target }}
          path: ${{ runner.temp }}/dependency-snapshot
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  dependency-refresh-compare:
    needs:
      - dependency-refresh-context
      - dependency-refresh-resolve
    if: ${{ needs.dependency-refresh-context.result == 'success' && needs.dependency-refresh-resolve.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      reason: ${{ steps.compare.outputs.reason }}
      dependency_set_sha256: ${{ steps.compare.outputs.dependency_set_sha256 }}
      source_tag: ${{ steps.compare.outputs.source_tag }}
      source_sha: ${{ steps.compare.outputs.source_sha }}
      project_version: ${{ steps.compare.outputs.project_version }}

    steps:
      - name: Check out dependency refresh tooling
        uses: actions/checkout@v7

      - name: Download target dependency snapshots
        uses: actions/download-artifact@v8
        with:
          pattern: dependency-snapshot-*
          path: dependency-snapshots

      - name: Merge target dependency snapshots
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t fragments < <(find dependency-snapshots -type f -name fragment.json -print | sort)
          python scripts/resolve_offline_dependencies.py merge \
            --fragment "${fragments[@]}" \
            --expected-target \
              linux-x86_64-cp311 \
              linux-x86_64-cp312 \
              linux-x86_64-cp313 \
              linux-x86_64-cp314 \
              macos-arm64-cp311 \
              macos-arm64-cp312 \
              macos-arm64-cp313 \
              macos-arm64-cp314 \
              windows-x86_64-cp313 \
            --output dependency-manifest.json

      - name: Download rolling release baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dependency-baseline
          release_json="$RUNNER_TEMP/dependency-latest-release.json"
          release_error="$RUNNER_TEMP/dependency-latest-release.error"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/dependency-latest" \
            > "$release_json" 2> "$release_error"; then
            if python - "$release_json" <<'PY'
          import json
          import sys
          from pathlib import Path

          expected = {
              "SHA256SUMS",
              "dependency-manifest.json",
              "paper-fetch-skill-offline-linux-x86_64-cp311.sh",
              "paper-fetch-skill-offline-linux-x86_64-cp312.sh",
              "paper-fetch-skill-offline-linux-x86_64-cp313.sh",
              "paper-fetch-skill-offline-linux-x86_64-cp314.sh",
              "paper-fetch-skill-offline-macos-arm64-cp311.tar.gz",
              "paper-fetch-skill-offline-macos-arm64-cp312.tar.gz",
              "paper-fetch-skill-offline-macos-arm64-cp313.tar.gz",
              "paper-fetch-skill-offline-macos-arm64-cp314.tar.gz",
              "paper-fetch-skill-windows-x86_64-setup.exe",
          }
          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          actual = set(assets)
          valid = (
              release.get("tag_name") == "dependency-latest"
              and release.get("prerelease") is True
              and actual == expected
          )
          if not valid:
              print(
                  "Rolling release is incomplete or malformed; forcing a rebuild. "
                  f"missing={sorted(expected - actual)}, extra={sorted(actual - expected)}",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          PY
            then
              mkdir -p dependency-baseline-candidate
              gh release download dependency-latest \
                --repo "$GITHUB_REPOSITORY" \
                --pattern dependency-manifest.json \
                --pattern SHA256SUMS \
                --dir dependency-baseline-candidate
              if python - "$release_json" dependency-baseline-candidate <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          release = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          baseline_dir = Path(sys.argv[2])
          assets = {asset["name"]: asset for asset in release.get("assets", [])}
          expected = set(assets)

          checksums = {}
          checksum_path = baseline_dir / "SHA256SUMS"
          for line in checksum_path.read_text(encoding="utf-8").splitlines():
              digest, separator, filename = line.partition("  ")
              if not separator or filename in checksums:
                  raise SystemExit("Rolling SHA256SUMS is malformed")
              checksums[filename] = digest
          if set(checksums) != expected - {"SHA256SUMS"}:
              raise SystemExit("Rolling SHA256SUMS has the wrong asset set")

          for filename, digest in checksums.items():
              if assets[filename].get("digest") != f"sha256:{digest}":
                  raise SystemExit(f"Rolling asset digest mismatch for {filename}")
          checksum_digest = hashlib.sha256(checksum_path.read_bytes()).hexdigest()
          if assets["SHA256SUMS"].get("digest") != f"sha256:{checksum_digest}":
              raise SystemExit("Rolling SHA256SUMS asset digest mismatch")

          manifest_path = baseline_dir / "dependency-manifest.json"
          manifest_digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          if assets["dependency-manifest.json"].get("digest") != f"sha256:{manifest_digest}":
              raise SystemExit("Rolling dependency manifest asset digest mismatch")
          PY
              then
                cp dependency-baseline-candidate/dependency-manifest.json \
                  dependency-baseline/dependency-manifest.json
              fi
            fi
          elif ! grep -Fq '(HTTP 404)' "$release_error"; then
            cat "$release_error" >&2
            exit 1
          fi

      - name: Compare resolved dependency set
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          force_args=()
          if [ "${{ inputs.force_refresh || false }}" = "true" ]; then
            force_args+=(--force)
          fi
          python scripts/resolve_offline_dependencies.py compare \
            --candidate dependency-manifest.json \
            --baseline dependency-baseline/dependency-manifest.json \
            --github-output "$GITHUB_OUTPUT" \
            "${force_args[@]}"

      - name: Upload merged dependency manifest
        uses: actions/upload-artifact@v7
        with:
          name: dependency-refresh-manifest
          path: dependency-manifest.json
          if-no-files-found: error
          retention-days: 1

  lint:
    if: ${{ github.event_name != 'schedule' && !inputs.force_refresh && (github.event_name != 'workflow_dispatch' || !inputs.run_offline_windows_only) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check ruff formatting
        run: python -m ruff format --check .

      - name: Run ruff
        run: python -m ruff check .

      - name: Run contract type check
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m mypy

      - name: Validate local preflight script
        run: bash scripts/dev-preflight.sh --help

  integration:
    if: ${{ github.event_name != 'schedule' && !inputs.force_refresh && (github.event_name != 'workflow_dispatch' || !inputs.run_offline_windows_only) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate extraction rules docs
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python scripts/validate_extraction_rules.py --ci

      - name: Run HTML availability regression contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest \
            tests/unit/test_html_availability.py \
            tests/unit/test_annualreviews_provider.py \
            tests/unit/test_block_corpus.py \
            -q

      - name: Run IOP supplementary asset regression contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest \
            tests/unit/test_iop_provider.py \
            tests/unit/test_browser_workflow_fetchers.py::test_file_fetcher_forwards_explicit_asset_referer \
            tests/unit/test_http_cache.py::HttpTransportCacheTests::test_url_redaction_covers_aws_signed_query_parameters \
            tests/unit/test_provider_request_options.py::ProviderRequestOptionsTests::test_shared_browser_file_fetcher_records_cloudflare_challenge_without_recovery \
            -q

      - name: Run MCP input schema contract
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest tests/unit/test_mcp_input_schema_contract.py -q

      - name: Run dependency refresh workflow contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest \
            tests/unit/test_resolve_offline_dependencies.py \
            tests/unit/test_ci_release_workflow.py \
            -q

      - name: Run cross-execution surface contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          python -m pytest \
            tests/unit/test_cli.py::CliTests::test_top_level_and_subcommand_help_contract_snapshot \
            tests/unit/test_cli.py::CliTests::test_explicit_fetch_and_legacy_root_fetch_have_same_contract \
            tests/unit/test_cli.py::CliTests::test_main_writes_markdown_json_and_both_to_stdout \
            tests/unit/test_mcp_payload_cache.py::McpPayloadCacheTests::test_build_server_exposes_output_schemas_for_all_tools \
            tests/unit/test_mcp_context_budget.py \
            tests/unit/test_mcp_provider_catalog.py \
            tests/unit/test_skill_information_architecture.py \
            tests/unit/test_presets_contract.py \
            tests/unit/test_mcp_batch_fetch.py \
            tests/unit/test_cli_run_manifest.py \
            tests/unit/test_manifest_persistence.py \
            tests/unit/test_install_provenance.py \
            tests/unit/test_acceptance_adapter_contract.py \
            -q

      - name: Run integration suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m pytest tests/integration -q --durations=30

  package-smoke:
    if: ${{ github.event_name != 'schedule' && !inputs.force_refresh && (github.event_name != 'workflow_dispatch' || !inputs.run_offline_windows_only) }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build wheel and sdist
        shell: bash
        run: |
          python -m build --outdir "$RUNNER_TEMP/paper-fetch-dist"
          test "$(find "$RUNNER_TEMP/paper-fetch-dist" -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find "$RUNNER_TEMP/paper-fetch-dist" -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

      - name: Install wheel in clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/paper-fetch-wheel-smoke"
          "$RUNNER_TEMP/paper-fetch-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/paper-fetch-wheel-smoke/bin/python" -m pip install "$RUNNER_TEMP"/paper-fetch-dist/*.whl

      - name: Verify console scripts
        shell: bash
        run: |
          smoke_root="$RUNNER_TEMP/paper-fetch-wheel-smoke"
          export PATH="$smoke_root/bin:/usr/bin:/bin"
          unset PAPER_FETCH_ENV_FILE
          version="$("$smoke_root/bin/python" -c 'from importlib.metadata import version; print(version("paper-fetch-skill"))')"
          test "$("$smoke_root/bin/paper-fetch" --version)" = "paper-fetch $version"
          "$RUNNER_TEMP/paper-fetch-wheel-smoke/bin/paper-fetch" --help >/dev/null
          "$smoke_root/bin/paper-fetch-install-formula-tools" --help >/dev/null
          "$smoke_root/bin/paper-fetch-install-image-tools" --help >/dev/null
          "$smoke_root/bin/paper-fetch-mcp" </dev/null
          doctor_exit=0
          export PAPER_FETCH_DOCTOR_REPORT="$RUNNER_TEMP/paper-fetch-wheel-doctor.json"
          "$smoke_root/bin/paper-fetch" doctor --json >"$PAPER_FETCH_DOCTOR_REPORT" || doctor_exit=$?
          test "$doctor_exit" -le 1
          "$RUNNER_TEMP/paper-fetch-wheel-smoke/bin/python" - <<'PY'
          import json
          import os
          from importlib.metadata import entry_points
          from pathlib import Path

          scripts = {entry_point.name: entry_point for entry_point in entry_points(group="console_scripts")}
          expected = {
              "paper-fetch",
              "paper-fetch-mcp",
              "paper-fetch-install-formula-tools",
              "paper-fetch-install-image-tools",
          }
          assert expected <= scripts.keys()
          for name in expected:
              scripts[name].load()

          payload = json.loads(
              Path(os.environ["PAPER_FETCH_DOCTOR_REPORT"]).read_text(encoding="utf-8")
          )
          provenance = payload["install_provenance"]
          assert provenance["status"] == "not_applicable"
          assert provenance["consistency"]["version_status"] == "ready"
          assert provenance["consistency"]["version_drift"] == []
          PY

  offline-linux-x86-64:
    needs: dependency-refresh-compare
    if: >-
      ${{
        always() &&
        (
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && !inputs.force_refresh) ||
          (
            (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_refresh)) &&
            needs.dependency-refresh-compare.result == 'success' &&
            needs.dependency-refresh-compare.outputs.changed == 'true'
          )
        ) &&
        (
          github.event_name != 'workflow_dispatch' ||
          !inputs.run_offline_windows_only ||
          inputs.force_refresh
        )
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            python-tag: "cp311"
          - python-version: "3.12"
            python-tag: "cp312"
          - python-version: "3.13"
            python-tag: "cp313"
          - python-version: "3.14"
            python-tag: "cp314"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'schedule' || inputs.force_refresh) && needs.dependency-refresh-compare.outputs.source_sha || github.ref }}

      - name: Check out dependency refresh tooling
        if: ${{ github.event_name == 'schedule' || inputs.force_refresh }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .dependency-refresh-automation

      - name: Download frozen dependency snapshot
        if: ${{ github.event_name == 'schedule' || inputs.force_refresh }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-snapshot-linux-x86_64-${{ matrix.python-tag }}
          path: ${{ runner.temp }}/dependency-snapshot

      - name: Download merged dependency manifest
        if: ${{ github.event_name == 'schedule' || inputs.force_refresh }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-refresh-manifest
          path: ${{ runner.temp }}/dependency-manifest

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Haskell toolchain for bundled texmath
        id: setup-haskell
        uses: haskell-actions/setup@v2.11.0
        with:
          ghc-version: "9.8.4"
          cabal-version: "latest"

      - name: Restore formula tool cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-offline-formula-tools-${{ steps.setup-haskell.outputs.ghc-version }}-${{ hashFiles('src/paper_fetch/formula/install.py', 'src/paper_fetch/resources/formula/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-offline-formula-tools-${{ steps.setup-haskell.outputs.ghc-version }}-

      - name: Install browser system dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright>=1.47,<1.61"
          python -m playwright install-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Build offline package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name == 'schedule' || inputs.force_refresh }}" = "true" ]; then
            snapshot_root="$RUNNER_TEMP/dependency-snapshot"
            python .dependency-refresh-automation/scripts/resolve_offline_dependencies.py verify \
              --manifest "$RUNNER_TEMP/dependency-manifest/dependency-manifest.json" \
              --target "linux-x86_64-${{ matrix.python-tag }}" \
              --snapshot-root "$snapshot_root"
            export PIP_NO_INDEX=1
            export PIP_DISABLE_PIP_VERSION_CHECK=1
            export PIP_FIND_LINKS="$snapshot_root/runtime-wheels $snapshot_root/support-wheels"
          fi
          scripts/build-offline-package.sh --output-dir "$PWD/offline-artifacts"

      - name: Verify offline package
        run: scripts/verify-offline-package.sh "$PWD/offline-artifacts/paper-fetch-skill-offline-linux-x86_64-${{ matrix.python-tag }}.sh"

      - name: Verify Linux runtime package layout
        shell: bash
        run: |
          set -euo pipefail
          package="$PWD/offline-artifacts/paper-fetch-skill-offline-linux-x86_64-${{ matrix.python-tag }}.sh"
          install_root="$RUNNER_TEMP/paper-fetch-layout-${{ matrix.python-tag }}"
          layout_home="$RUNNER_TEMP/paper-fetch-layout-home-${{ matrix.python-tag }}"
          rm -rf "$install_root" "$layout_home"
          mkdir -p "$layout_home"
          HOME="$layout_home" SHELL=/bin/bash "$package" --install-dir "$install_root" --preset=headless --no-user-config --skip-smoke
          test -f "$install_root/runtime/site-packages/paper_fetch/__init__.py"
          test -x "$install_root/bin/paper-fetch"
          test -x "$install_root/bin/paper-fetch-install-formula-tools"
          test -x "$install_root/bin/paper-fetch-install-image-tools"
          grep -F -q "PAPER_FETCH_IMAGE_TOOLS_DIR=\"$install_root/image-tools\"" "$install_root/offline.env"
          for forbidden in src tests wheelhouse dist .github pyproject.toml; do
            if [ -e "$install_root/$forbidden" ]; then
              echo "Linux runtime package must not include source/build path: $forbidden" >&2
              exit 1
            fi
          done

      - name: Upload offline package
        uses: actions/upload-artifact@v7
        with:
          name: paper-fetch-skill-offline-linux-x86_64-${{ matrix.python-tag }}
          path: offline-artifacts/paper-fetch-skill-offline-linux-x86_64-${{ matrix.python-tag }}.sh
          if-no-files-found: error

  offline-macos-install:
    needs: dependency-refresh-compare
    if: >-
      ${{
        always() &&
        (
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && !inputs.force_refresh) ||
          (
            (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_refresh)) &&
            needs.dependency-refresh-compare.result == 'success' &&
            needs.dependency-refresh-compare.outputs.changed == 'true'
          )
        ) &&
        (
          github.event_name != 'workflow_dispatch' ||
          !inputs.run_offline_windows_only ||
          inputs.force_refresh
        )
      }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            python-tag: "cp311"
          - python-version: "3.12"
            python-tag: "cp312"
          - python-version: "3.13"
            python-tag: "cp313"
          - python-version: "3.14"
            python-tag: "cp314"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'schedule' || inputs.force_refresh) && needs.dependency-refresh-compare.outputs.source_sha || github.ref }}

      - name: Check out dependency refresh tooling
        if: ${{ github.event_name == 'schedule' || inputs.force_refresh }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .dependency-refresh-automation

      - name: Download frozen dependency snapshot
        if: ${{ github.event_name == 'schedule' || inputs.force_refresh }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-snapshot-macos-arm64-${{ matrix.python-tag }}
          path: ${{ runner.temp }}/dependency-snapshot

      - name: Download merged dependency manifest
        if: ${{ github.event_name == 'schedule' || inputs.force_refresh }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-refresh-manifest
          path: ${{ runner.temp }}/dependency-manifest

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Haskell toolchain for bundled texmath
        id: setup-haskell
        uses: haskell-actions/setup@v2.11.0
        with:
          ghc-version: "9.8.4"
          cabal-version: "latest"

      - name: Restore formula tool cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-offline-formula-tools-${{ steps.setup-haskell.outputs.ghc-version }}-${{ hashFiles('src/paper_fetch/formula/install.py', 'src/paper_fetch/resources/formula/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-offline-formula-tools-${{ steps.setup-haskell.outputs.ghc-version }}-

      - name: Build macOS offline package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name == 'schedule' || inputs.force_refresh }}" = "true" ]; then
            snapshot_root="$RUNNER_TEMP/dependency-snapshot"
            python .dependency-refresh-automation/scripts/resolve_offline_dependencies.py verify \
              --manifest "$RUNNER_TEMP/dependency-manifest/dependency-manifest.json" \
              --target "macos-arm64-${{ matrix.python-tag }}" \
              --snapshot-root "$snapshot_root"
            export PIP_NO_INDEX=1
            export PIP_DISABLE_PIP_VERSION_CHECK=1
            export PIP_FIND_LINKS="$snapshot_root/runtime-wheels $snapshot_root/support-wheels"
          fi
          scripts/build-offline-package.sh --output-dir "$PWD/offline-artifacts"

      - name: Verify macOS offline package
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            arm64|aarch64) package_arch="arm64" ;;
            x86_64|amd64) package_arch="x86_64" ;;
            *) echo "Unsupported macOS runner architecture: $arch" >&2; exit 1 ;;
          esac
          scripts/verify-offline-package.sh "$PWD/offline-artifacts/paper-fetch-skill-offline-macos-$package_arch-${{ matrix.python-tag }}.tar.gz"

      - name: Verify macOS headful install layout
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            arm64|aarch64) package_arch="arm64" ;;
            x86_64|amd64) package_arch="x86_64" ;;
            *) echo "Unsupported macOS runner architecture: $arch" >&2; exit 1 ;;
          esac
          package="$PWD/offline-artifacts/paper-fetch-skill-offline-macos-$package_arch-${{ matrix.python-tag }}.tar.gz"
          bundle_root="$RUNNER_TEMP/paper-fetch-macos-bundle"
          bundle="$bundle_root/paper-fetch-skill-offline-macos-$package_arch-${{ matrix.python-tag }}"
          install_root="$RUNNER_TEMP/paper-fetch-macos-install"
          layout_home="$RUNNER_TEMP/paper-fetch-macos-home"
          rm -rf "$bundle_root" "$install_root" "$layout_home"
          mkdir -p "$bundle_root" "$layout_home"
          tar -xzf "$package" -C "$bundle_root"
          HOME="$layout_home" SHELL=/bin/bash "$bundle/install-offline.sh" --install-dir "$install_root" --preset=headful --no-user-config --skip-smoke
          test -f "$install_root/runtime/site-packages/paper_fetch/__init__.py"
          test -x "$install_root/bin/paper-fetch"
          test -x "$install_root/bin/paper-fetch-install-formula-tools"
          test -x "$install_root/bin/paper-fetch-install-image-tools"
          grep -F -q 'CLOAKBROWSER_CDP_ENDPOINT="ws://127.0.0.1:9222/devtools/browser/..."' "$install_root/offline.env"
          grep -F -q 'PAPER_FETCH_BROWSER_HEADLESS="false"' "$install_root/offline.env"
          grep -F -q "PAPER_FETCH_IMAGE_TOOLS_DIR=\"$install_root/image-tools\"" "$install_root/offline.env"
          test -f "$layout_home/.gemini/antigravity-cli/skills/paper-fetch-skill/SKILL.md"
          test -f "$layout_home/.gemini/antigravity-cli/mcp_config.json"
          "$install_root/runtime/paper-fetch-python" -X utf8 - "$layout_home/.gemini/antigravity-cli/mcp_config.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          server = data["mcpServers"]["paper-fetch"]
          assert "paper_fetch.mcp.server" in server["args"], server
          PY
          for forbidden in src tests wheelhouse dist .github pyproject.toml; do
            if [ -e "$install_root/$forbidden" ]; then
              echo "macOS runtime package must not include source/build path: $forbidden" >&2
              exit 1
            fi
          done

      - name: Verify macOS installed package browser smoke
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          case "$arch" in
            arm64|aarch64) package_arch="arm64" ;;
            x86_64|amd64) package_arch="x86_64" ;;
            *) echo "Unsupported macOS runner architecture: $arch" >&2; exit 1 ;;
          esac
          package="$PWD/offline-artifacts/paper-fetch-skill-offline-macos-$package_arch-${{ matrix.python-tag }}.tar.gz"
          bundle_root="$RUNNER_TEMP/paper-fetch-macos-browser-bundle"
          bundle="$bundle_root/paper-fetch-skill-offline-macos-$package_arch-${{ matrix.python-tag }}"
          install_root="$RUNNER_TEMP/paper-fetch-macos-browser-install"
          browser_home="$RUNNER_TEMP/paper-fetch-macos-browser-home"
          browser_profile="$RUNNER_TEMP/paper-fetch-macos-browser-profile"
          rm -rf "$bundle_root" "$install_root" "$browser_home" "$browser_profile"
          mkdir -p "$bundle_root" "$browser_home" "$browser_profile"
          tar -xzf "$package" -C "$bundle_root"

          browser_binary=""
          for candidate in \
            "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
            "/Applications/Chromium.app/Contents/MacOS/Chromium" \
            "/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge"; do
            if [ -x "$candidate" ]; then
              browser_binary="$candidate"
              break
            fi
          done
          [ -n "$browser_binary" ] || {
            echo "No executable browser binary found for macOS CloakBrowser smoke." >&2
            exit 1
          }

          HOME="$browser_home" \
          SHELL=/bin/bash \
          "$bundle/install-offline.sh" --install-dir "$install_root" --preset=headless --no-user-config

          # shellcheck disable=SC1091
          source "$install_root/activate-offline.sh"
          export PAPER_FETCH_BROWSER_BINARY="$browser_binary"
          export PAPER_FETCH_BROWSER_PROFILE="$browser_profile"

          paper-fetch --help >/dev/null
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          import os
          from pathlib import Path
          import socket

          from paper_fetch.runtime_browser import BrowserContextManager

          binary_path = os.environ.get("PAPER_FETCH_BROWSER_BINARY")
          assert binary_path and Path(binary_path).is_file(), binary_path
          profile = os.environ.get("PAPER_FETCH_BROWSER_PROFILE")
          assert profile, profile
          profile_path = Path(profile)
          profile_path.mkdir(parents=True, exist_ok=True)
          (profile_path / "SingletonLock").symlink_to(
              f"{socket.gethostname()}-99999999"
          )
          (profile_path / "SingletonSocket").symlink_to(
              profile_path / "missing-singleton-socket"
          )
          (profile_path / "SingletonCookie").symlink_to("123456789")

          manager = BrowserContextManager(
              binary_path=binary_path,
              profile_dir=profile_path,
          )

          def open_context(index):
              context = manager.new_context()
              try:
                  page = context.new_page()
                  page.goto(
                      "data:text/html,<title>paper-fetch macOS browser smoke "
                      f"{index}</title><main>ok</main>"
                  )
                  assert page.title() == f"paper-fetch macOS browser smoke {index}"
                  return index
              finally:
                  context.close()

          try:
              with ThreadPoolExecutor(max_workers=4) as executor:
                  completed = list(executor.map(open_context, range(50)))
              assert completed == list(range(50)), completed
          finally:
              manager.close()

          for singleton_name in (
              "SingletonLock",
              "SingletonSocket",
              "SingletonCookie",
          ):
              singleton = profile_path / singleton_name
              assert not singleton.exists() and not singleton.is_symlink(), singleton
          recoveries = list(
              (profile_path / ".paper-fetch-browser-diagnostics").glob(
                  "singleton-recovery-*/recovery.json"
              )
          )
          assert recoveries, "stale singleton recovery diagnostic was not written"
          PY

      - name: Upload macOS offline package
        uses: actions/upload-artifact@v7
        with:
          name: paper-fetch-skill-offline-macos-${{ matrix.python-tag }}
          path: offline-artifacts/paper-fetch-skill-offline-macos-*-${{ matrix.python-tag }}.tar.gz
          if-no-files-found: error

  offline-windows-x86-64:
    needs: dependency-refresh-compare
    if: >-
      ${{
        always() &&
        (
          startsWith(github.ref, 'refs/tags/v') ||
          (github.event_name == 'workflow_dispatch' && !inputs.force_refresh) ||
          (
            (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.force_refresh)) &&
            needs.dependency-refresh-compare.result == 'success' &&
            needs.dependency-refresh-compare.outputs.changed == 'true'
          )
        )
      }}
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ (github.event_name == 'schedule' || inputs.force_refresh) && needs.dependency-refresh-compare.outputs.source_sha || github.ref }}

      - name: Check out dependency refresh tooling
        if: ${{ github.event_name == 'schedule' || inputs.force_refresh }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .dependency-refresh-automation

      - name: Download frozen dependency snapshot
        if: ${{ github.event_name == 'schedule' || inputs.force_refresh }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-snapshot-windows-x86_64-cp313
          path: ${{ runner.temp }}/dependency-snapshot

      - name: Download merged dependency manifest
        if: ${{ github.event_name == 'schedule' || inputs.force_refresh }}
        uses: actions/download-artifact@v8
        with:
          name: dependency-refresh-manifest
          path: ${{ runner.temp }}/dependency-manifest

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Haskell toolchain for bundled texmath
        id: setup-haskell
        uses: haskell-actions/setup@v2.11.0
        with:
          ghc-version: "9.8.4"
          cabal-version: "latest"

      - name: Restore formula tool cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
          key: ${{ runner.os }}-offline-formula-tools-${{ steps.setup-haskell.outputs.ghc-version }}-${{ hashFiles('src/paper_fetch/formula/install.py', 'src/paper_fetch/resources/formula/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-offline-formula-tools-${{ steps.setup-haskell.outputs.ghc-version }}-

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build offline package
        shell: pwsh
        run: |
          if ("${{ github.event_name == 'schedule' || inputs.force_refresh }}" -eq "true") {
            $snapshotRoot = Join-Path $env:RUNNER_TEMP "dependency-snapshot"
            python .dependency-refresh-automation/scripts/resolve_offline_dependencies.py verify `
              --manifest (Join-Path $env:RUNNER_TEMP "dependency-manifest/dependency-manifest.json") `
              --target "windows-x86_64-cp313" `
              --snapshot-root $snapshotRoot
            if ($LASTEXITCODE -ne 0) {
              throw "Frozen Windows dependency snapshot verification failed."
            }
            $env:PIP_NO_INDEX = "1"
            $env:PIP_DISABLE_PIP_VERSION_CHECK = "1"
            $env:PIP_FIND_LINKS = "$(Join-Path $snapshotRoot 'runtime-wheels') $(Join-Path $snapshotRoot 'support-wheels')"
          }
          ./scripts/build-offline-package-windows.ps1 -OutputDir "$PWD/offline-artifacts"

      - name: Verify setup installer
        shell: pwsh
        run: |
          $setup = "$PWD/offline-artifacts/paper-fetch-skill-windows-x86_64-setup.exe"
          $installRoot = Join-Path $env:RUNNER_TEMP "PaperFetchSkill"
          $fakeBin = Join-Path $env:RUNNER_TEMP "paper-fetch-fake-hosts"
          $fakeLog = Join-Path $env:RUNNER_TEMP "paper-fetch-fake-hosts.log"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $installRoot, $fakeBin
          Remove-Item -Force -ErrorAction SilentlyContinue $fakeLog
          New-Item -ItemType Directory -Force -Path $installRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $fakeBin | Out-Null

          @'
          @echo off
          echo codex %*>>"%PAPER_FETCH_FAKE_CLI_LOG%"
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin "codex.cmd") -Encoding ASCII
          @'
          @echo off
          echo claude %*>>"%PAPER_FETCH_FAKE_CLI_LOG%"
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin "claude.cmd") -Encoding ASCII

          $env:PAPER_FETCH_FAKE_CLI_LOG = $fakeLog
          $env:PATH = "$fakeBin;$env:PATH"
          $preexistingOfflineEnv = @(
            'ELSEVIER_API_KEY="secret"',
            'USER_NOTE="keep"',
            '',
            '# BEGIN paper-fetch offline managed',
            "PAPER_FETCH_DOWNLOAD_DIR='C:/old/downloads'",
            '# END paper-fetch offline managed'
          ) -join "`n"
          $preexistingOfflineEnv += "`n"
          [System.IO.File]::WriteAllText((Join-Path $installRoot "offline.env"), $preexistingOfflineEnv, [System.Text.UTF8Encoding]::new($false))
          foreach ($staleDir in @("src", "tests", ".github", "wheelhouse", "dist")) {
            New-Item -ItemType Directory -Force -Path (Join-Path $installRoot $staleDir) | Out-Null
            [System.IO.File]::WriteAllText((Join-Path (Join-Path $installRoot $staleDir) "old.txt"), "old", [System.Text.UTF8Encoding]::new($false))
          }
          [System.IO.File]::WriteAllText((Join-Path $installRoot "pyproject.toml"), "[project]", [System.Text.UTF8Encoding]::new($false))

          $setupLog = Join-Path $env:RUNNER_TEMP "paper-fetch-setup.log"
          $setupArgs = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=`"$installRoot`"",
            "/LOG=`"$setupLog`""
          )
          $setupProcess = Start-Process -FilePath $setup -ArgumentList $setupArgs -Wait -PassThru
          if ($setupProcess.ExitCode -ne 0) {
            Get-Content $setupLog -ErrorAction SilentlyContinue
            throw "Setup installer failed with exit code $($setupProcess.ExitCode)"
          }

          $runtimePython = Join-Path $installRoot "runtime/python.exe"
          $mathmlNode = Join-Path $installRoot "runtime/Lib/site-packages/playwright/driver/node.exe"
          function Invoke-RuntimePythonScript {
            param(
              [string]$Script,
              [string[]]$Arguments = @()
            )

            $scriptPath = Join-Path $env:RUNNER_TEMP ("paper-fetch-smoke-{0}.py" -f [System.Guid]::NewGuid().ToString("N"))
            try {
              [System.IO.File]::WriteAllText($scriptPath, $Script, [System.Text.UTF8Encoding]::new($false))
              & $runtimePython -X utf8 $scriptPath @Arguments
              if ($LASTEXITCODE -ne 0) {
                throw "Bundled Python smoke script failed with exit code $LASTEXITCODE"
              }
            } finally {
              Remove-Item -LiteralPath $scriptPath -Force -ErrorAction SilentlyContinue
            }
          }

          foreach ($requiredPath in @(
            "runtime/Lib/site-packages/paper_fetch/__init__.py",
            "bin/paper-fetch.cmd",
            "bin/paper-fetch-mcp.cmd",
            "bin/paper-fetch-install-image-tools.cmd",
            "skills/paper-fetch-skill/SKILL.md",
            "installer/manifest.json",
            "scripts/windows-installer-helper.ps1"
          )) {
            $absoluteRequiredPath = Join-Path $installRoot $requiredPath
            if (-not (Test-Path -LiteralPath $absoluteRequiredPath)) {
              throw "Windows installer is missing runtime path: $requiredPath"
            }
          }
          foreach ($forbiddenPath in @(
            "src",
            "tests",
            ".github",
            "wheelhouse",
            "dist",
            "pyproject.toml"
          )) {
            $absoluteForbiddenPath = Join-Path $installRoot $forbiddenPath
            if (Test-Path -LiteralPath $absoluteForbiddenPath) {
              throw "Windows runtime package must not include source/build path: $forbiddenPath"
            }
          }
          $offlineEnv = Get-Content -LiteralPath (Join-Path $installRoot "offline.env") -Raw
          $offlineEnvRoot = $installRoot.Replace("\", "/")
          $managedBeginCount = [regex]::Matches($offlineEnv, [regex]::Escape("# BEGIN paper-fetch offline managed")).Count
          if (-not $offlineEnv.Contains('ELSEVIER_API_KEY="secret"')) {
            throw "Existing offline.env secret was not preserved.`n$offlineEnv"
          }
          if (-not $offlineEnv.Contains('USER_NOTE="keep"')) {
            throw "Existing offline.env custom content was not preserved.`n$offlineEnv"
          }
          if ($managedBeginCount -ne 1) {
            throw "Expected one managed offline.env block, found $managedBeginCount.`n$offlineEnv"
          }
          if ($offlineEnv.Contains("C:/old/downloads")) {
            throw "Old offline.env managed block was not replaced.`n$offlineEnv"
          }
          if (-not $offlineEnv.Contains("$offlineEnvRoot/downloads")) {
            throw "offline.env managed block does not point at the install root.`n$offlineEnv"
          }
          if (-not $offlineEnv.Contains("PAPER_FETCH_IMAGE_TOOLS_DIR='$offlineEnvRoot/image-tools'")) {
            throw "offline.env managed block does not point at bundled image tools.`n$offlineEnv"
          }
          if (-not $offlineEnv.Contains("MATHML_TO_LATEX_NODE_BIN='$offlineEnvRoot/runtime/Lib/site-packages/playwright/driver/node.exe'")) {
            throw "offline.env managed block does not pin bundled MathML Node.`n$offlineEnv"
          }
          if ($offlineEnv -match "(?m)^\s*PAPER_FETCH_BROWSER_USER_AGENT") {
            throw "offline.env managed block must not override the default Camoufox fingerprint user agent.`n$offlineEnv"
          }

          $providerStatusCheck = @'
          import paper_fetch
          import paper_fetch.mcp.server
          from paper_fetch.mcp.fetch_tool import provider_status_payload

          assert "providers" in provider_status_payload()
          '@
          Invoke-RuntimePythonScript -Script $providerStatusCheck
          & (Join-Path $installRoot "bin/paper-fetch.cmd") --help | Out-Null
          & (Join-Path $installRoot "bin/paper-fetch-install-image-tools.cmd") --target-dir (Join-Path $installRoot "image-tools") | Out-Null
          & (Join-Path $installRoot "formula-tools/bin/texmath.exe") --help | Out-Null
          & $mathmlNode --version | Out-Null

          $browserRuntimeCheck = @'
          import camoufox
          import cloakbrowser
          import playwright
          from paper_fetch.runtime_browser import BrowserContextManager

          assert hasattr(camoufox, "Camoufox")
          assert hasattr(cloakbrowser, "ensure_binary")
          assert BrowserContextManager is not None
          '@
          Invoke-RuntimePythonScript -Script $browserRuntimeCheck

          $log = Get-Content -LiteralPath $fakeLog -Raw
          foreach ($expected in @(
            "codex mcp remove paper-fetch",
            "codex mcp add",
            "PAPER_FETCH_IMAGE_TOOLS_DIR=$installRoot\image-tools",
            "MATHML_TO_LATEX_NODE_BIN=$installRoot\runtime\Lib\site-packages\playwright\driver\node.exe",
            "PAPER_FETCH_BROWSER_HEADLESS=true",
            "claude mcp remove -s user paper-fetch",
            "claude mcp add -s user"
          )) {
            if ($log -notlike "*$expected*") {
              throw "Fake host CLI log is missing: $expected`n$log"
            }
          }

          # Antigravity has no CLI to register MCP; it is configured via files.
          $antigravityHome = Join-Path $env:USERPROFILE ".gemini/antigravity-cli"
          $antigravitySkill = Join-Path $antigravityHome "skills/paper-fetch-skill/SKILL.md"
          if (-not (Test-Path -LiteralPath $antigravitySkill -PathType Leaf)) {
            throw "Antigravity skill was not installed: $antigravitySkill"
          }
          $antigravityMcpConfig = Join-Path $antigravityHome "mcp_config.json"
          if (-not (Test-Path -LiteralPath $antigravityMcpConfig -PathType Leaf)) {
            throw "Antigravity mcp_config.json was not written: $antigravityMcpConfig"
          }
          $mcpConfig = Get-Content -LiteralPath $antigravityMcpConfig -Raw | ConvertFrom-Json
          $antigravityServer = $mcpConfig.mcpServers."paper-fetch"
          if ($null -eq $antigravityServer) {
            throw "Antigravity mcp_config.json is missing the 'paper-fetch' server.`n$(Get-Content -LiteralPath $antigravityMcpConfig -Raw)"
          }
          if (-not ($antigravityServer.args -contains "paper_fetch.mcp.server")) {
            throw "Antigravity 'paper-fetch' server does not launch paper_fetch.mcp.server.`n$(Get-Content -LiteralPath $antigravityMcpConfig -Raw)"
          }

      - name: Upload offline package
        uses: actions/upload-artifact@v7
        with:
          name: paper-fetch-skill-windows-x86_64-setup
          path: offline-artifacts/paper-fetch-skill-windows-x86_64-setup.exe
          if-no-files-found: error

  release-offline-packages:
    needs:
      - lint
      - integration
      - package-smoke
      - offline-linux-x86-64
      - offline-macos-install
      - offline-windows-x86-64
    if: >-
      ${{
        always() &&
        needs.lint.result == 'success' &&
        needs.integration.result == 'success' &&
        needs.package-smoke.result == 'success' &&
        needs.offline-linux-x86-64.result == 'success' &&
        needs.offline-macos-install.result == 'success' &&
        needs.offline-windows-x86-64.result == 'success' &&
        !inputs.force_refresh &&
        !inputs.run_offline_windows_only &&
        startsWith(github.ref, 'refs/tags/v') &&
        (
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download offline packages
        uses: actions/download-artifact@v8
        with:
          pattern: paper-fetch-skill-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            paper-fetch-skill-offline-linux-x86_64-cp311.sh
            paper-fetch-skill-offline-linux-x86_64-cp312.sh
            paper-fetch-skill-offline-linux-x86_64-cp313.sh
            paper-fetch-skill-offline-linux-x86_64-cp314.sh
            paper-fetch-skill-windows-x86_64-setup.exe
          )
          python_tags=(cp311 cp312 cp313 cp314)

          for asset in "${expected[@]}"; do
            if [ ! -f "release-artifacts/$asset" ]; then
              echo "Missing release asset: $asset" >&2
              exit 1
            fi
          done
          macos_asset_count=0
          for python_tag in "${python_tags[@]}"; do
            shopt -s nullglob
            macos_assets=(release-artifacts/paper-fetch-skill-offline-macos-*-"$python_tag".tar.gz)
            shopt -u nullglob
            if [ "${#macos_assets[@]}" -ne 1 ]; then
              echo "Expected exactly one macOS $python_tag release asset, found ${#macos_assets[@]}:" >&2
              find release-artifacts -maxdepth 1 -type f -name 'paper-fetch-skill-offline-macos-*.tar.gz' -print | sort >&2
              exit 1
            fi
            macos_asset_name="$(basename "${macos_assets[0]}")"
            if [[ "$macos_asset_name" != "paper-fetch-skill-offline-macos-arm64-$python_tag.tar.gz" && "$macos_asset_name" != "paper-fetch-skill-offline-macos-x86_64-$python_tag.tar.gz" ]]; then
              echo "Unexpected macOS release asset name: ${macos_assets[0]}" >&2
              exit 1
            fi
            macos_asset_count=$((macos_asset_count + ${#macos_assets[@]}))
          done

          actual_count="$(find release-artifacts -maxdepth 1 -type f | wc -l | tr -d ' ')"
          expected_count="$((${#expected[@]} + macos_asset_count))"
          if [ "$actual_count" -ne "$expected_count" ]; then
            echo "Expected $expected_count release assets, found $actual_count:" >&2
            find release-artifacts -maxdepth 1 -type f -print | sort >&2
            exit 1
          fi

          find release-artifacts -maxdepth 1 -type f -print | sort

      - name: Extract release notes from CHANGELOG_CN
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v prefix="## $version " '
            index($0, "## ") == 1 {
              if (started) { exit }
              if (index($0, prefix) == 1) { started = 1; print; next }
              next
            }
            started { print }
          ' CHANGELOG_CN.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG_CN section found for version $version" >&2
            exit 1
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  release-dependency-refresh:
    needs:
      - dependency-refresh-compare
      - offline-linux-x86-64
      - offline-macos-install
      - offline-windows-x86-64
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.force_refresh)
        ) &&
        needs.dependency-refresh-compare.result == 'success' &&
        needs.dependency-refresh-compare.outputs.changed == 'true' &&
        needs.offline-linux-x86-64.result == 'success' &&
        needs.offline-macos-install.result == 'success' &&
        needs.offline-windows-x86-64.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require rolling release token
        shell: bash
        env:
          ROLLING_RELEASE_TOKEN: ${{ secrets.ROLLING_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ROLLING_RELEASE_TOKEN:-}" ]; then
            echo "ROLLING_RELEASE_TOKEN Actions secret is required." >&2
            exit 1
          fi

      - name: Download offline packages
        uses: actions/download-artifact@v8
        with:
          pattern: paper-fetch-skill-*
          path: release-artifacts
          merge-multiple: true

      - name: Download dependency manifest
        uses: actions/download-artifact@v8
        with:
          name: dependency-refresh-manifest
          path: release-artifacts

      - name: Verify rolling release assets and write checksums
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            dependency-manifest.json
            paper-fetch-skill-offline-linux-x86_64-cp311.sh
            paper-fetch-skill-offline-linux-x86_64-cp312.sh
            paper-fetch-skill-offline-linux-x86_64-cp313.sh
            paper-fetch-skill-offline-linux-x86_64-cp314.sh
            paper-fetch-skill-offline-macos-arm64-cp311.tar.gz
            paper-fetch-skill-offline-macos-arm64-cp312.tar.gz
            paper-fetch-skill-offline-macos-arm64-cp313.tar.gz
            paper-fetch-skill-offline-macos-arm64-cp314.tar.gz
            paper-fetch-skill-windows-x86_64-setup.exe
          )
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected-assets.txt"
          find release-artifacts -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$RUNNER_TEMP/actual-assets.txt"
          if ! diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "Rolling release build did not produce the exact expected asset set." >&2
            exit 1
          fi
          (
            cd release-artifacts
            sha256sum "${expected[@]}" | LC_ALL=C sort -k2 > SHA256SUMS
          )

      - name: Write rolling release notes
        shell: bash
        env:
          SOURCE_TAG: ${{ needs.dependency-refresh-compare.outputs.source_tag }}
          SOURCE_SHA: ${{ needs.dependency-refresh-compare.outputs.source_sha }}
          PROJECT_VERSION: ${{ needs.dependency-refresh-compare.outputs.project_version }}
          DEPENDENCY_SET_SHA256: ${{ needs.dependency-refresh-compare.outputs.dependency_set_sha256 }}
          REFRESH_REASON: ${{ needs.dependency-refresh-compare.outputs.reason }}
        run: |
          set -euo pipefail
          updated_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          {
            echo "## Rolling dependency build"
            echo
            echo "> This prerelease is mutable. Assets under the fixed \`dependency-latest\` tag are replaced when the resolved Python dependency set changes."
            echo
            echo "- Stable source: [\`$SOURCE_TAG\`](https://github.com/$GITHUB_REPOSITORY/releases/tag/$SOURCE_TAG) (\`$SOURCE_SHA\`)"
            echo "- Project version: \`$PROJECT_VERSION\`"
            echo "- Dependency set SHA256: \`$DEPENDENCY_SET_SHA256\`"
            echo "- Refresh reason: \`$REFRESH_REASON\`"
            echo "- Updated at: \`$updated_at\`"
            echo
            echo "Verify downloaded assets with \`SHA256SUMS\`. For immutable, reproducible releases, use a stable \`v*\` release instead."
          } > release-notes.md

      - name: Move rolling tag to stable source
        env:
          GH_TOKEN: ${{ secrets.ROLLING_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.dependency-refresh-compare.outputs.source_sha }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dependency-latest" >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/dependency-latest" \
              -f sha="$SOURCE_SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/dependency-latest' \
              -f sha="$SOURCE_SHA" >/dev/null
          fi

      - name: Publish rolling prerelease
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.ROLLING_RELEASE_TOKEN }}
          tag_name: dependency-latest
          target_commitish: ${{ needs.dependency-refresh-compare.outputs.source_sha }}
          name: dependency-latest (${{ needs.dependency-refresh-compare.outputs.source_tag }})
          body_path: release-notes.md
          files: release-artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: true
          preserve_order: true
          generate_release_notes: false
          prerelease: true
          make_latest: false

      - name: Remove stale rolling release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ROLLING_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          {
            cat "$RUNNER_TEMP/expected-assets.txt"
            echo SHA256SUMS
          } | LC_ALL=C sort > "$RUNNER_TEMP/expected-release-assets.txt"
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/dependency-latest" --jq .id)"
          while IFS=$'\t' read -r asset_id asset_name; do
            if ! grep -Fqx "$asset_name" "$RUNNER_TEMP/expected-release-assets.txt"; then
              echo "Removing stale rolling asset: $asset_name"
              gh api --method DELETE \
                "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            fi
          done < <(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" \
              --jq '.[] | [.id, .name] | @tsv'
          )

      - name: Verify published rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ROLLING_RELEASE_TOKEN }}
          SOURCE_SHA: ${{ needs.dependency-refresh-compare.outputs.source_sha }}
        run: |
          set -euo pipefail
          published_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/tags/dependency-latest" \
            --jq .object.sha)"
          if [ "$published_sha" != "$SOURCE_SHA" ]; then
            echo "Published rolling tag points to $published_sha, expected $SOURCE_SHA." >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dependency-latest" \
            > "$RUNNER_TEMP/published-dependency-release.json"
          python - "$RUNNER_TEMP/published-dependency-release.json" release-artifacts <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          release_path = Path(sys.argv[1])
          artifact_dir = Path(sys.argv[2])

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          release = json.loads(release_path.read_text(encoding="utf-8"))
          if release.get("tag_name") != "dependency-latest":
              raise SystemExit("Published release has the wrong tag")
          if release.get("prerelease") is not True or release.get("draft") is not False:
              raise SystemExit("Published rolling release flags are invalid")

          local = {path.name: path for path in artifact_dir.iterdir() if path.is_file()}
          remote = {asset["name"]: asset for asset in release.get("assets", [])}
          if set(local) != set(remote):
              raise SystemExit(
                  "Published asset set mismatch: "
                  f"missing={sorted(set(local) - set(remote))}, "
                  f"extra={sorted(set(remote) - set(local))}"
              )
          for name, path in sorted(local.items()):
              digest = sha256(path)
              asset = remote[name]
              if asset.get("size") != path.stat().st_size:
                  raise SystemExit(f"Published size mismatch for {name}")
              if asset.get("digest") != f"sha256:{digest}":
                  raise SystemExit(f"Published SHA256 mismatch for {name}")
          print(f"Verified {len(local)} rolling release assets.")
          PY

  full-golden:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.force_refresh && inputs.run_full_golden && !inputs.run_offline_windows_only }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Haskell toolchain for formula tests
        id: setup-haskell
        uses: haskell-actions/setup@v2.11.0
        with:
          ghc-version: "9.8.4"
          cabal-version: "latest"

      - name: Restore formula tool cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            .formula-tools
          key: ${{ runner.os }}-formula-tools-${{ steps.setup-haskell.outputs.ghc-version }}-${{ hashFiles('src/paper_fetch/formula/install.py', 'src/paper_fetch/resources/formula/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-formula-tools-${{ steps.setup-haskell.outputs.ghc-version }}-

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install formula test backend
        run: |
          python -m paper_fetch.formula.install --target-dir "$PWD/.formula-tools" --no-node
          ./.formula-tools/bin/texmath --help >/dev/null

      - name: Install image test backend
        run: python -m paper_fetch.image_tools.install --target-dir "$PWD/.image-tools"

      - name: Run full golden corpus regression
        env:
          PAPER_FETCH_RUN_FULL_GOLDEN: "1"
          PAPER_FETCH_FORMULA_TOOLS_DIR: ${{ github.workspace }}/.formula-tools
          PAPER_FETCH_IMAGE_TOOLS_DIR: ${{ github.workspace }}/.image-tools
        run: python -m pytest tests/integration/test_golden_corpus.py -q

  live-mcp:
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.force_refresh && inputs.run_live_mcp && !inputs.run_offline_windows_only }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run live MCP suite when secrets are available
        shell: bash
        env:
          PAPER_FETCH_RUN_LIVE: "1"
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
        run: |
          missing=()
          for key in CROSSREF_MAILTO ELSEVIER_API_KEY; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Skipping live MCP tests because required secrets are missing: ${missing[*]}"
            exit 0
          fi

          # Live MCP tests share external publisher/API state and secrets, so they
          # run serially even though local unit/integration and CI integration
          # suites use xdist.
          pytest -n 0 tests/live/test_live_mcp.py -k "not ieee"

          if [ "${{ inputs.run_ieee_live_mcp }}" = "true" ]; then
            pytest -n 0 tests/live/test_live_mcp.py -k "ieee"
          else
            echo "Skipping IEEE live MCP smoke; enable run_ieee_live_mcp on an authorized runner/network."
          fi
