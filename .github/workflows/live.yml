name: Opt-in live and golden checks

on:
  schedule:
    # Weekly offline full-corpus regression.
    - cron: "17 3 * * 2"
    # Twice-monthly, low-concurrency publisher drift review.
    - cron: "41 4 1,15 * *"
  workflow_dispatch:
    inputs:
      run_live:
        description: Run live provider tests
        required: false
        default: false
        type: boolean
      run_full_golden:
        description: Run the complete golden corpus
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  live:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.run_live) ||
        (github.event_name == 'schedule' && github.event.schedule == '41 4 1,15 * *')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"
          full: "true"
      - name: Prepare selected Camoufox runtime explicitly
        run: uv run python -m camoufox fetch
      - name: Prepare formula conversion backend explicitly
        run: PAPER_FETCH_INSTALL_PYTHON_BIN=.venv/bin/python ./install-formula-tools.sh
      - name: Run shared-state live tests serially
        env:
          PAPER_FETCH_RUN_LIVE: "1"
          PAPER_FETCH_BROWSER_BACKEND: "camoufox"
          PAPER_FETCH_RUN_AIP_COLD_STABILITY: "1"
          PAPER_FETCH_LIVE_ARTIFACT_DIR: artifacts/live-publishers
          PAPER_FETCH_FORMULA_TOOLS_DIR: .formula-tools
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          WILEY_TDM_CLIENT_TOKEN: ${{ secrets.WILEY_TDM_CLIENT_TOKEN }}
        run: >-
          PYTHONPATH=src uv run pytest
          tests/live/test_live_publishers.py
          tests/live/test_live_mcp.py
          -q -n 0
          --junitxml=artifacts/live-publishers.xml
          -o junit_family=legacy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: live-publisher-acceptance
          path: |
            artifacts/live-publishers
            artifacts/live-publishers.xml
          if-no-files-found: warn
      - name: Run browser-risk provider drift report serially
        env:
          PAPER_FETCH_RUN_LIVE: "1"
          PAPER_FETCH_BROWSER_BACKEND: "camoufox"
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
          WILEY_TDM_CLIENT_TOKEN: ${{ secrets.WILEY_TDM_CLIENT_TOKEN }}
        run: >-
          PYTHONPATH=src uv run python scripts/run_provider_drift_report.py
          --all-browser-risk
          --output artifacts/provider-drift-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: provider-drift-report
          path: artifacts/provider-drift-report.json
          if-no-files-found: warn

  full-golden:
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.run_full_golden) ||
        (github.event_name == 'schedule' && github.event.schedule == '17 3 * * 2')
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"
          full: "true"
      - name: Run complete golden corpus
        env:
          PAPER_FETCH_RUN_FULL_GOLDEN: "1"
        run: |
          PYTHONPATH=src uv run pytest \
            tests/integration/test_golden_corpus.py -q
