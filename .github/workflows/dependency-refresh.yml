name: Dependency refresh

on:
  schedule:
    - cron: "17 19 * * 1"
  workflow_dispatch:

concurrency:
  group: dependency-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  latest-compatible:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"
          full: "true"
      - name: Resolve latest compatible graph without changing the checkout
        run: |
          cp uv.lock "$RUNNER_TEMP/uv.lock.baseline"
          uv lock --upgrade
          uv sync --extra dev --extra full
          uv export --locked --all-extras --format requirements-txt \
            --no-hashes --no-emit-project \
            --output-file "$RUNNER_TEMP/locked-requirements.txt"
          uv run python -m pip_audit \
            --requirement "$RUNNER_TEMP/locked-requirements.txt" \
            --progress-spinner off
          PYTHONPATH=src uv run python -m pytest tests/unit -q
          if ! cmp -s uv.lock "$RUNNER_TEMP/uv.lock.baseline"; then
            echo "::notice::Compatible dependency updates are available; run uv lock --upgrade."
          fi
