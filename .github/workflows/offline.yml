name: Offline packages

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to package; defaults to the caller commit
        required: false
        type: string
      posix_tooling_ref:
        description: Trusted commit whose POSIX builder, installer, and verifier should overlay an immutable source ref
        required: false
        type: string
      windows_tooling_ref:
        description: Trusted commit whose atomic Windows installer toolchain should overlay an immutable source ref
        required: false
        type: string
      frozen_dependencies:
        description: Build from dependency-snapshot-* artifacts produced by the rolling resolver
        required: false
        default: false
        type: boolean
      dependency_tooling_ref:
        description: Trusted commit containing the dependency snapshot verifier
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to package; defaults to the selected branch
        required: false
        type: string

permissions:
  contents: read

jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            target: linux-x86_64-cp311
          - os: ubuntu-latest
            python-version: "3.12"
            target: linux-x86_64-cp312
          - os: ubuntu-latest
            python-version: "3.13"
            target: linux-x86_64-cp313
          - os: ubuntu-latest
            python-version: "3.14"
            target: linux-x86_64-cp314
          - os: macos-15
            python-version: "3.11"
            target: macos-arm64-cp311
          - os: macos-15
            python-version: "3.12"
            target: macos-arm64-cp312
          - os: macos-15
            python-version: "3.13"
            target: macos-arm64-cp313
          - os: macos-15
            python-version: "3.14"
            target: macos-arm64-cp314
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}
          full: "true"
      - name: Validate immutable source macOS adaptation contract
        run: uv run python scripts/validate_macos_adaptation.py
      - name: Validate trusted POSIX tooling revision
        if: ${{ inputs.posix_tooling_ref != '' }}
        env:
          TOOLING_REF: ${{ inputs.posix_tooling_ref }}
        run: |
          if [[ ! "$TOOLING_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "posix_tooling_ref must be an immutable 40-character commit SHA." >&2
            exit 1
          fi
      - name: Check out trusted POSIX release tooling
        if: ${{ inputs.posix_tooling_ref != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.posix_tooling_ref }}
          path: .posix-release-tooling
          persist-credentials: false
      - name: Validate trusted macOS adaptation tooling
        if: ${{ inputs.posix_tooling_ref != '' }}
        working-directory: .posix-release-tooling
        run: uv run --project .. python scripts/validate_macos_adaptation.py
      - name: Overlay trusted POSIX release tooling
        if: ${{ inputs.posix_tooling_ref != '' }}
        run: |
          install -m 0755 \
            .posix-release-tooling/scripts/build-offline-package.sh \
            scripts/build-offline-package.sh
          install -m 0755 \
            .posix-release-tooling/install-offline.sh \
            install-offline.sh
          install -m 0755 \
            .posix-release-tooling/scripts/verify-offline-package.sh \
            scripts/verify-offline-package.sh
          install -m 0755 \
            .posix-release-tooling/scripts/generate_offline_evidence.py \
            scripts/generate_offline_evidence.py
      - name: Check out dependency snapshot tooling
        if: ${{ inputs.frozen_dependencies }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.dependency_tooling_ref }}
          path: .dependency-refresh-automation
      - name: Set up pinned Haskell toolchain
        id: formula-haskell
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.12.1.0"
      - name: Cache Cabal formula dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.formula-haskell.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ runner.arch }}-ghc-9.10.3-texmath-0.13.2
      - name: Download frozen dependency snapshot
        if: ${{ inputs.frozen_dependencies }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-snapshot-${{ matrix.target }}
          path: ${{ runner.temp }}/dependency-snapshot
      - name: Download merged dependency manifest
        if: ${{ inputs.frozen_dependencies }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-refresh-manifest
          path: ${{ runner.temp }}/dependency-manifest
      - name: Build full offline package
        env:
          PYTHON_BIN: python
          MACOSX_DEPLOYMENT_TARGET: "15.0"
          PAPER_FETCH_OFFLINE_TOOLING_REVISION: ${{ inputs.posix_tooling_ref }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.frozen_dependencies }}" = "true" ]; then
            snapshot_root="$RUNNER_TEMP/dependency-snapshot"
            python .dependency-refresh-automation/scripts/resolve_offline_dependencies.py verify \
              --manifest "$RUNNER_TEMP/dependency-manifest/dependency-manifest.json" \
              --target "${{ matrix.target }}" \
              --snapshot-root "$snapshot_root"
            export PIP_NO_INDEX=1
            export PIP_DISABLE_PIP_VERSION_CHECK=1
            export PIP_FIND_LINKS="$snapshot_root/runtime-wheels $snapshot_root/support-wheels"
          fi
          scripts/build-offline-package.sh --output-dir dist
      - name: Verify offline package
        env:
          PAPER_FETCH_OFFLINE_SKIP_FETCH_SMOKE: "1"
        run: |
          shopt -s nullglob
          if [ "${{ runner.os }}" = "macOS" ]; then
            packages=(dist/*.tar.gz)
          else
            packages=(dist/*.sh)
          fi
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one offline package, found ${#packages[@]}." >&2
            exit 1
          fi
          scripts/verify-offline-package.sh "${packages[0]}"
          test -f "dist/paper-fetch-evidence-${{ matrix.target }}.dependency-manifest.json"
          test -f "dist/paper-fetch-evidence-${{ matrix.target }}.sbom.cdx.json"
      - name: Scan offline artifacts for secret values
        id: secret_scan_offline_posix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/scan_artifacts_for_secrets.py --root dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.secret_scan_offline_posix.outcome == 'success' }}
        with:
          name: offline-${{ runner.os }}-${{ matrix.python-version }}
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.13"
          full: "true"
      - name: Validate immutable source macOS adaptation contract
        run: uv run python scripts/validate_macos_adaptation.py
      - name: Validate trusted Windows tooling revision
        if: ${{ inputs.windows_tooling_ref != '' }}
        shell: bash
        env:
          TOOLING_REF: ${{ inputs.windows_tooling_ref }}
        run: |
          if [[ ! "$TOOLING_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "windows_tooling_ref must be an immutable 40-character commit SHA." >&2
            exit 1
          fi
      - name: Overlay trusted Windows release tooling
        if: ${{ inputs.windows_tooling_ref != '' }}
        shell: bash
        env:
          TOOLING_REF: ${{ inputs.windows_tooling_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$TOOLING_REF"
          git show "$TOOLING_REF:scripts/build-offline-package-windows.ps1" \
            > scripts/build-offline-package-windows.ps1
          git show "$TOOLING_REF:scripts/generate_offline_evidence.py" \
            > scripts/generate_offline_evidence.py
          git show "$TOOLING_REF:scripts/verify-windows-installer-lifecycle.ps1" \
            > scripts/verify-windows-installer-lifecycle.ps1
          git show "$TOOLING_REF:scripts/windows-installer-helper.ps1" \
            > scripts/windows-installer-helper.ps1
          git show "$TOOLING_REF:installer/manifest.json" \
            > installer/manifest.json
          git show "$TOOLING_REF:installer/paper-fetch-skill.iss" \
            > installer/paper-fetch-skill.iss
      - name: Check out dependency snapshot tooling
        if: ${{ inputs.frozen_dependencies }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.dependency_tooling_ref }}
          path: .dependency-refresh-automation
      - name: Set up pinned Haskell toolchain
        id: formula-haskell
        uses: haskell-actions/setup@6037f33647c3f17758a2356c80fc4a53d7e0685d # v2.12.0
        with:
          ghc-version: "9.10.3"
          cabal-version: "3.12.1.0"
      - name: Cache Cabal formula dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.formula-haskell.outputs.cabal-store }}
          key: cabal-${{ runner.os }}-${{ runner.arch }}-ghc-9.10.3-texmath-0.13.2
      - name: Download frozen dependency snapshot
        if: ${{ inputs.frozen_dependencies }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-snapshot-windows-x86_64-cp313
          path: ${{ runner.temp }}/dependency-snapshot
      - name: Download merged dependency manifest
        if: ${{ inputs.frozen_dependencies }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-refresh-manifest
          path: ${{ runner.temp }}/dependency-manifest
      - name: Build Windows full offline installer
        shell: pwsh
        env:
          PAPER_FETCH_OFFLINE_TOOLING_REVISION: ${{ inputs.windows_tooling_ref }}
        run: |
          if ("${{ inputs.frozen_dependencies }}" -eq "true") {
            $snapshotRoot = Join-Path $env:RUNNER_TEMP "dependency-snapshot"
            python .dependency-refresh-automation/scripts/resolve_offline_dependencies.py verify `
              --manifest (Join-Path $env:RUNNER_TEMP "dependency-manifest/dependency-manifest.json") `
              --target "windows-x86_64-cp313" `
              --snapshot-root $snapshotRoot
            if ($LASTEXITCODE -ne 0) {
              throw "Frozen Windows dependency snapshot verification failed."
            }
            $env:PIP_NO_INDEX = "1"
            $env:PIP_DISABLE_PIP_VERSION_CHECK = "1"
            $env:PIP_FIND_LINKS = "$(Join-Path $snapshotRoot 'runtime-wheels') $(Join-Path $snapshotRoot 'support-wheels')"
          }
          scripts/build-offline-package-windows.ps1 -OutputDir dist -PythonBin python
      - name: Verify final EXE install, overwrite upgrade, and uninstall serially
        shell: pwsh
        run: |
          # This gate intentionally has no matrix/xdist parallelism (-n 0 equivalent):
          # installation state, HKCU PATH, and Inno uninstall registration are shared.
          $setup = Get-Item "dist/paper-fetch-skill-windows-x86_64-setup.exe"
          $version = python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          & scripts/verify-windows-installer-lifecycle.ps1 `
            -SetupPath $setup.FullName `
            -ExpectedVersion $version.Trim()
          foreach ($evidence in @(
            "dist/paper-fetch-evidence-windows-x86_64-cp313.dependency-manifest.json",
            "dist/paper-fetch-evidence-windows-x86_64-cp313.sbom.cdx.json"
          )) {
            if (-not (Test-Path -LiteralPath $evidence -PathType Leaf)) {
              throw "Windows offline build is missing staged evidence: $evidence"
            }
          }
      - name: Scan Windows offline artifacts for secret values
        id: secret_scan_offline_windows
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/scan_artifacts_for_secrets.py --root dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ steps.secret_scan_offline_windows.outcome == 'success' }}
        with:
          name: offline-Windows-3.13
          path: dist/*
          if-no-files-found: error
