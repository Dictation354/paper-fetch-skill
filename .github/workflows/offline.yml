name: macOS beta.42 verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: macos-15
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: ${{ matrix.python-version }}
          full: "true"
      - name: Diagnose latest native browser startup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEBUG: pw:browser
        run: |
          PYTHONPATH=src uv run python -u - <<'DIAG'
          import json, os, signal, subprocess, sys, tempfile, time
          from pathlib import Path
          from paper_fetch.providers.browser_runtime.preparation import prepare_camoufox_managed_runtime
          from paper_fetch.providers.browser_runtime.byparr_preparation import prepare_source, PreparationBudget
          probe = prepare_camoufox_managed_runtime()
          print(probe, flush=True)
          runtime = prepare_source(Path(os.environ["RUNNER_TEMP"]) / "byparr", PreparationBudget(120))
          root = Path(tempfile.mkdtemp(prefix="paper-fetch-debug-"))
          launcher = Path("src/paper_fetch/providers/browser_runtime/byparr_launcher.py").resolve()
          settings = {"work_dir": str(root), "runtime": str(runtime), "binary_path": None, "headless": True, "local_check": True, "token": "local-debug", "site_paths": [str(Path(p).resolve()) for p in sys.path if p], "server_script": str(launcher.with_name("byparr_server.cjs"))}
          (root / "config.json").write_text(json.dumps(settings))
          (root / "start").touch()
          command = "import faulthandler,runpy,sys; faulthandler.enable(); faulthandler.dump_traceback_later(20,repeat=True); launcher=sys.argv.pop(1); runpy.run_path(launcher,run_name='__main__')"
          with (root / "service.log").open("wb") as output:
              process = subprocess.Popen([sys.executable, "-I", "-S", "-u", "-c", command, str(launcher), str(root / "config.json")], stdout=output, stderr=output, start_new_session=True)
          try:
              for attempt in range(90):
                  if process.poll() is not None or (root / "ready.json").exists():
                      break
                  time.sleep(1)
              print("exit", process.poll(), "files", sorted(p.name for p in root.iterdir()), flush=True)
              print((root / "service.log").read_text(errors="replace"), flush=True)
              assert (root / "ready.json").exists(), "Latest native browser did not become ready"
          finally:
              if process.poll() is None:
                  os.killpg(process.pid, signal.SIGTERM)
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
          DIAG
      - name: Verify shared browser contracts with beta.42
        env:
          PAPER_FETCH_TEST_BYPARR_CACHE: ${{ runner.temp }}/byparr
          PYTEST_XDIST_AUTO_NUM_WORKERS: "2"
        run: PYTHONPATH=src uv run python -m pytest tests/integration/test_pnas_byparr.py -q
      - name: Verify proxy preferences and browser unit contracts
        run: PYTHONPATH=src uv run python -m pytest tests/unit/test_camoufox_backend.py tests/unit/test_pnas_byparr.py -q
