name: Stable release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable v* tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: version
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$DISPATCH_TAG"
          fi
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match project version $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          python3 scripts/sync_version.py --check

  offline:
    needs: verify-tag
    uses: ./.github/workflows/offline.yml
    with:
      ref: ${{ needs.verify-tag.outputs.tag }}
      posix_tooling_ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}
      windows_tooling_ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || '' }}

  publish:
    needs: [verify-tag, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.tag }}
      - uses: ./.github/actions/setup-python-deps
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Build Python distributions and CycloneDX SBOM
        run: |
          uv build
          mkdir -p release-assets/python
          cp dist/* release-assets/python/
          uv export --locked --all-extras --format requirements-txt \
            --no-hashes --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
          uv run cyclonedx-py requirements "$RUNNER_TEMP/requirements.txt" \
            --output-file release-assets/paper-fetch-sbom.cdx.json
          find release-assets -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum \
            > release-assets/SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/**/*
      - name: Write Chinese stable release notes
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          heading="## $VERSION - "
          awk -v heading="$heading" '
            index($0, heading) == 1 {
              in_section = 1
            }
            in_section && /^## / && index($0, heading) != 1 {
              exit
            }
            in_section {
              print
            }
          ' CHANGELOG_CN.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG_CN.md has no release notes for $VERSION." >&2
            exit 1
          fi
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag --notes-file release-notes.md --title "$TAG"
