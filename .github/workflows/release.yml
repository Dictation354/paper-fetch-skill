name: v8.0.0 macOS backfill

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v8.0.0 tag to backfill
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - name: Check out repository refs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable tagged commit
        id: source
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$DISPATCH_TAG"
          test "$tag" = "v8.0.0"
          git fetch --force --tags origin
          git cat-file -e "refs/tags/$tag^{tag}" 2>/dev/null || \
            git cat-file -e "refs/tags/$tag^{commit}"
          source_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          test "$source_sha" = "eb27ea4510d3191551397686dd476ab723c5489d"
          git checkout --detach "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match project version $version at $source_sha." >&2
            exit 1
          fi
          python3 scripts/sync_version.py --check
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          matrix="$(python3 scripts/prepare_release_assets.py matrix |
            jq -ce '{include: [.include[] | select(.os == "macos-15")]} | select(.include | length == 4)')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  resolve-dependencies:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-tag.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long source paths on Windows
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.source_sha }}
          persist-credentials: false
      - name: Set up target Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install compatible resolver tooling
        run: python -m pip install "pip>=26.1.2,<27" "packaging>=26.2,<27"
      - name: Resolve frozen full dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.verify-tag.outputs.source_sha }}"
          python scripts/resolve_offline_dependencies.py resolve \
            --project-root . \
            --output-dir "$RUNNER_TEMP/dependency-snapshot" \
            --target "${{ matrix.target }}" \
            --source-tag "${{ needs.verify-tag.outputs.tag }}" \
            --source-sha "${{ needs.verify-tag.outputs.source_sha }}"
      - name: Scan target dependency snapshot for secret values
        id: secret_scan_dependency_snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/scan_artifacts_for_secrets.py
          --env-var GITHUB_TOKEN
          --root "$RUNNER_TEMP/dependency-snapshot"
      - name: Upload target dependency snapshot
        if: ${{ steps.secret_scan_dependency_snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-snapshot-${{ matrix.target }}
          path: ${{ runner.temp }}/dependency-snapshot
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  merge-dependencies:
    needs: [verify-tag, resolve-dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.source_sha }}
          persist-credentials: false
      - name: Download target dependency snapshots
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dependency-snapshot-*
          path: dependency-snapshots
      - name: Merge exact release dependency targets
        shell: bash
        env:
          RELEASE_MATRIX: ${{ needs.verify-tag.outputs.matrix }}
        run: |
          set -euo pipefail
          mapfile -t fragments < <(find dependency-snapshots -type f -name fragment.json -print | sort)
          target_list="$(jq -er '.include[].target' <<< "$RELEASE_MATRIX")"
          mapfile -t targets <<< "$target_list"
          python scripts/resolve_offline_dependencies.py merge \
            --fragment "${fragments[@]}" \
            --expected-target "${targets[@]}" \
            --output dependency-manifest.json
      - name: Scan merged dependency manifest for secret values
        id: secret_scan_dependency_manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/scan_artifacts_for_secrets.py
          --env-var GITHUB_TOKEN
          --root dependency-manifest.json
      - name: Upload merged dependency manifest
        if: ${{ steps.secret_scan_dependency_manifest.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: merged-dependency-manifest
          path: dependency-manifest.json
          if-no-files-found: error
          retention-days: 1

  offline:
    needs: [verify-tag, merge-dependencies]
    uses: ./.github/workflows/offline.yml
    with:
      ref: ${{ needs.verify-tag.outputs.source_sha }}
      frozen_dependencies: true
      macos_backfill: true
      release_version: ${{ needs.verify-tag.outputs.version }}

  attest-backfill:
    needs: [verify-tag, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate immutable tag and checked-out source
        shell: bash
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify-tag.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SOURCE_SHA"
      - name: Download verified macOS packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: offline-macOS-*
          path: release-inputs
      - name: Validate archive metadata and merge checksums
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.verify-tag.outputs.source_sha }}
          VERSION: ${{ needs.verify-tag.outputs.version }}
          ORIGINAL_SUMS_SHA256: 62e223861916bb7b0c02f239038283384376ecfa0bb301d96282d0ec55d85dc6
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/SHA256SUMS" \
            --output original.SHA256SUMS
          echo "$ORIGINAL_SUMS_SHA256  original.SHA256SUMS" | sha256sum --check
          mkdir release-assets
          PYTHONPATH=scripts python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import tarfile

          from prepare_release_assets import TARGET_ARTIFACTS, installer_asset_names

          version = os.environ["VERSION"]
          source_sha = os.environ["SOURCE_SHA"]
          inputs = Path("release-inputs")
          output = Path("release-assets")
          originals = Path("original.SHA256SUMS").read_text().splitlines()
          assert {line.split()[1] for line in originals} == installer_asset_names(version)
          rows = []
          for target, artifact, name in TARGET_ARTIFACTS:
              if not target.startswith("macos-"):
                  continue
              abi = target.rsplit("-", 1)[1]
              archive = inputs / artifact / name
              with tarfile.open(archive, "r:gz") as bundle:
                  member = bundle.extractfile(f"{name.removesuffix('.tar.gz')}/offline-manifest.json")
                  assert member is not None, name
                  manifest = json.load(member)
              assert manifest["version"] == version, name
              assert manifest["git_revision"] == source_sha, name
              assert manifest["target"] == {
                  "platform": "macos",
                  "arch": "arm64",
                  "python_tag": abi,
                  "minimum_os_version": "15.0",
              }, name
              with archive.open("rb") as handle:
                  digest = hashlib.file_digest(handle, "sha256").hexdigest()
              rows.append(f"{digest}  {name}")
              shutil.move(archive, output / name)
              print(f"{name}: {source_sha}, arm64, {abi}, sha256:{digest}")

          assert len(originals) == 5 and len(rows) == 4
          assert not list(inputs.rglob("*.tar.gz"))
          lines = sorted(originals + rows, key=lambda row: row.split()[1])
          (output / "SHA256SUMS").write_text("\n".join(lines) + "\n")
          PYTHON
      - name: Scan backfill artifacts for secret values
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/scan_artifacts_for_secrets.py
          --env-var GITHUB_TOKEN
          --root release-assets
      - name: Attest backfill artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/**/*
      - name: Upload attested checksums for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-backfill-checksums
          path: release-assets/SHA256SUMS
          if-no-files-found: error
