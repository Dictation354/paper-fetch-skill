name: Stable release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable v* tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
      tag: ${{ steps.source.outputs.tag }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - name: Check out repository refs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable tagged commit
        id: source
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$DISPATCH_TAG"
          fi
          case "$tag" in
            v*) ;;
            *)
              echo "Stable release tag must start with v: $tag" >&2
              exit 1
              ;;
          esac
          git fetch --force --tags origin
          git cat-file -e "refs/tags/$tag^{tag}" 2>/dev/null || \
            git cat-file -e "refs/tags/$tag^{commit}"
          source_sha="$(git rev-parse "refs/tags/$tag^{commit}")"
          if [[ ! "$source_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Tag $tag did not peel to a full commit SHA." >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            event_sha="$(git rev-parse "$GITHUB_SHA^{commit}")"
            if [ "$event_sha" != "$source_sha" ]; then
              echo "Push event SHA $event_sha does not match tagged commit $source_sha." >&2
              exit 1
            fi
          fi
          git checkout --detach "$source_sha"
          test "$(git rev-parse HEAD)" = "$source_sha"
          version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag does not match project version $version at $source_sha." >&2
            exit 1
          fi
          python3 scripts/sync_version.py --check
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

  package:
    needs: verify-tag
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.verify-tag.outputs.source_sha }}

  resolve-dependencies:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            target: linux-x86_64-cp311
          - os: ubuntu-latest
            python-version: "3.12"
            target: linux-x86_64-cp312
          - os: ubuntu-latest
            python-version: "3.13"
            target: linux-x86_64-cp313
          - os: ubuntu-latest
            python-version: "3.14"
            target: linux-x86_64-cp314
          - os: macos-15
            python-version: "3.11"
            target: macos-arm64-cp311
          - os: macos-15
            python-version: "3.12"
            target: macos-arm64-cp312
          - os: macos-15
            python-version: "3.13"
            target: macos-arm64-cp313
          - os: macos-15
            python-version: "3.14"
            target: macos-arm64-cp314
          - os: windows-latest
            python-version: "3.13"
            target: windows-x86_64-cp313
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.source_sha }}
          persist-credentials: false
      - name: Set up target Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install compatible resolver tooling
        run: python -m pip install "pip>=26.1.2,<27" "packaging>=26.2,<27"
      - name: Resolve frozen full dependency snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.verify-tag.outputs.source_sha }}"
          python scripts/resolve_offline_dependencies.py resolve \
            --project-root . \
            --output-dir "$RUNNER_TEMP/dependency-snapshot" \
            --target "${{ matrix.target }}" \
            --source-tag "${{ needs.verify-tag.outputs.tag }}" \
            --source-sha "${{ needs.verify-tag.outputs.source_sha }}"
      - name: Scan target dependency snapshot for secret values
        id: secret_scan_dependency_snapshot
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/scan_artifacts_for_secrets.py
          --env-var GITHUB_TOKEN
          --root "$RUNNER_TEMP/dependency-snapshot"
      - name: Upload target dependency snapshot
        if: ${{ steps.secret_scan_dependency_snapshot.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-snapshot-${{ matrix.target }}
          path: ${{ runner.temp }}/dependency-snapshot
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  merge-dependencies:
    needs: [verify-tag, resolve-dependencies]
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.source_sha }}
          persist-credentials: false
      - name: Download target dependency snapshots
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dependency-snapshot-*
          path: dependency-snapshots
      - name: Merge exact nine-target dependency manifest
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t fragments < <(find dependency-snapshots -type f -name fragment.json -print | sort)
          python scripts/resolve_offline_dependencies.py merge \
            --fragment "${fragments[@]}" \
            --expected-target \
              linux-x86_64-cp311 \
              linux-x86_64-cp312 \
              linux-x86_64-cp313 \
              linux-x86_64-cp314 \
              macos-arm64-cp311 \
              macos-arm64-cp312 \
              macos-arm64-cp313 \
              macos-arm64-cp314 \
              windows-x86_64-cp313 \
            --output dependency-manifest.json
      - name: Scan merged dependency manifest for secret values
        id: secret_scan_dependency_manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python scripts/scan_artifacts_for_secrets.py
          --env-var GITHUB_TOKEN
          --root dependency-manifest.json
      - name: Upload merged dependency manifest
        if: ${{ steps.secret_scan_dependency_manifest.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-refresh-manifest
          path: dependency-manifest.json
          if-no-files-found: error
          retention-days: 1

  offline:
    needs: [verify-tag, merge-dependencies]
    uses: ./.github/workflows/offline.yml
    with:
      ref: ${{ needs.verify-tag.outputs.source_sha }}
      posix_tooling_ref: ${{ needs.verify-tag.outputs.source_sha }}
      windows_tooling_ref: ${{ needs.verify-tag.outputs.source_sha }}
      frozen_dependencies: true
      dependency_tooling_ref: ${{ needs.verify-tag.outputs.source_sha }}

  publish:
    needs: [verify-tag, package, merge-dependencies, offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-tag.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Revalidate immutable tag and checked-out source
        shell: bash
        env:
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify-tag.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --force --tags origin
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SOURCE_SHA"
      - name: Download verified Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: release-inputs/python
      - name: Download frozen offline targets and staged evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: offline-*
          path: release-inputs/offline
      - name: Download merged dependency manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-refresh-manifest
          path: release-inputs/dependencies
      - name: Validate, flatten, and checksum the exact release asset set
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/prepare_release_assets.py prepare-stable \
            --input-root release-inputs \
            --output-dir release-assets \
            --version "$VERSION"
          test -f release-assets/SHA256SUMS
      - name: Scan stable release artifacts for secret values
        id: secret_scan_release_assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/scan_artifacts_for_secrets.py
          --env-var GITHUB_TOKEN
          --env-var GH_TOKEN
          --root release-assets
      - name: Attest release artifacts
        if: ${{ steps.secret_scan_release_assets.outcome == 'success' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/**/*
      - name: Write Chinese stable release notes
        shell: bash
        env:
          VERSION: ${{ needs.verify-tag.outputs.version }}
        run: |
          set -euo pipefail
          heading="## $VERSION - "
          awk -v heading="$heading" '
            index($0, heading) == 1 {
              in_section = 1
            }
            in_section && /^## / && index($0, heading) != 1 {
              exit
            }
            in_section {
              print
            }
          ' CHANGELOG_CN.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG_CN.md has no release notes for $VERSION." >&2
            exit 1
          fi
      - name: Publish immutable release assets
        if: ${{ steps.secret_scan_release_assets.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-tag.outputs.tag }}
          SOURCE_SHA: ${{ needs.verify-tag.outputs.source_sha }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-assets -maxdepth 1 -type f -print0 | sort -z
          )
          gh release create "$TAG" "${assets[@]}" \
            --target "$SOURCE_SHA" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "$TAG"
