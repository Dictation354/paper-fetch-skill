name: Set up locked Python environment
description: Install Python, uv, and the reproducible project environment.
inputs:
  python-version:
    description: CPython version
    required: true
  full:
    description: Install browser and PDF runtime extras
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        enable-cache: auto
        prune-cache: true
    - name: Sync locked development environment
      shell: bash
      env:
        INSTALL_FULL: ${{ inputs.full }}
      run: |
        set -euo pipefail
        if [ "$INSTALL_FULL" = "true" ]; then
          uv sync --frozen --extra dev --extra full
        else
          uv sync --frozen --extra dev
        fi
