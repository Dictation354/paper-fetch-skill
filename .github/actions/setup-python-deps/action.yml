name: Set up locked Python environment
description: Install Python, uv, and the reproducible project environment.
inputs:
  python-version:
    description: CPython version
    required: true
  full:
    description: Install browser and PDF runtime extras
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: auto
        prune-cache: true
    - name: Sync locked development environment
      shell: bash
      env:
        INSTALL_FULL: ${{ inputs.full }}
      run: |
        set -euo pipefail
        if [ "$INSTALL_FULL" = "true" ]; then
          uv sync --frozen --extra dev --extra full
        else
          uv sync --frozen --extra dev
        fi
