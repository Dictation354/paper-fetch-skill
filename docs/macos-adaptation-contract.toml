[[changes]]
id = "MAC-V4-004"
title = "采用 Zsh 与 macOS platformdirs 布局"
area = "shell-and-filesystem"
status = "implemented"
risk = "P1"
summary = "安装器支持默认 Zsh、从任意目录 source 激活脚本、保留 startup symlink，把用户配置写到 platformdirs 对应的 Application Support 目录，并让 MCP cache scope 接受 /var 与 /private/var 或 /tmp 与 /private/tmp 等价根路径；该 alias 行为由原生 macOS CI 精确测试。"
rationale = "macOS 默认 shell、用户目录和系统路径别名语义不能沿用 Linux XDG/Bash 与单一绝对路径假设。"
