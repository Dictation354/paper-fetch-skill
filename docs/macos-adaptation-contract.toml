[[changes]]
id = "MAC-V4-006"
title = "把原生 macOS 证据纳入 split offline 发布门禁"
area = "ci-release"
status = "implemented"
risk = "P0"
summary = "常规 CI 在固定 macos-15 arm64 runner 上精确测试 /var 或 /tmp 的系统 cache alias 并构建验证 cp314；可复用 offline workflow 验证 cp311-cp314 全矩阵，稳定发布必须等待 offline workflow。"
rationale = "每次变更需要快速原生 cp314 回归，发布还需要完整 ABI 矩阵；Linux、WSL 和 Windows 的静态或模拟测试无法证明 Mach-O、codesign、xattr、Zsh 和原生安装行为。"
implementation_paths = [
