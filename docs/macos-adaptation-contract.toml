[[changes]]
id = "MAC-V4-003"
title = "明确 Camoufox 离线边界并移除 FlareSolverr"
area = "browser-runtime"
status = "implemented"
risk = "P1"
summary = "browser/full extra 允许兼容的 Camoufox 0.5.5+ 版本；开发与常规 CI 继续消费 uv.lock，离线构建则以已解析 wheelhouse 中的唯一 Camoufox wheel 为版本来源，并复核 wheel metadata、installed distribution 与 manifest 一致。离线包捆绑 Python 包但不捆绑浏览器 binary，安装器不得下载；CLI live browser 路径可按策略首次准备，MCP/库默认 opt-in，进入受限网络前仍应显式预置并用 browser-preflight 验证。原生 macOS CI runtime discovery 使用只读 workflow token 避免匿名 GitHub API 限额，live 验证只保留本地显式入口。Camoufox/Playwright navigation、redirect、子资源与 service worker 使用浏览器原生网络行为，不安装 context-wide URL/DNS interceptor，也不限制 credentialed context origin；catalog route 只编译 timeout、retry、QPS、acceptance、asset scope/cap 与 browser deadline，host/sensitive-header 数据不自动成为授权 allowlist。Direct/asset 请求保留 HTTP(S)、标准端口、公网 DNS、userinfo、HTTPS downgrade、逐跳 redirect 和跨域标准敏感头基线；显式 caller allowlist 继续 fail closed。二进制允许 shared-hostname transport 或 browser-owned image/file/PDF bytes，两者都经过统一预算、MIME/像素、staging、原子发布与取消门禁。正文资产必须有显式 20 秒、route cap 2 的 assets route；每篇论文每个 host 只做一次 direct probe，browser byte recovery 成功后才复用该 host 路径，状态不跨论文持久化。逐资源记录 candidate resolution，browser prepare/release 另记 stage timing。实际注入的 storage-state 以 provider/backend/canonical path/final digest 进入 MCP private cache scope，并用 path/exists/used diagnostics 区分配置与使用，空路径不得污染 public。主文档空壳诊断并列记录 Playwright requestfinished、Content-Length、捕获 DOM 字节与 Navigation Timing，只保留脱敏 URL 和布尔 transfer 事实。selected-browser 页面等待稳定正文 DOM；Wiley 401/403 在有界 readiness 后仅当正文连续稳定、页面 DOI 精确匹配且无 challenge、验证码、no-access 或 datalayer 阻断时暂时豁免状态判定，后续 Markdown/availability 仍须通过且结果保留真实状态；实质正文就绪后页头登录导航交给正文感知验收，challenge、其它 HTTP 强拒绝、404 与摘要重定向仍早期阻断；provider 可在捕获 HTML 前执行有界、同源、失败不阻断的页面准备。PNAS 使用与解析器一致的 #bodymatter selector 和 8 秒正文稳定预算；已验收 preflight HTML 按 provider/DOI/target/runtime 指纹在同进程一次性复用，AIP 维持跨 RuntimeContext 禁用边界，figure discovery 在同一 runtime 串行复用专用 page。arXiv source、Copernicus JATS graphic 与 AIP srcset 优先官方原图；Taylor & Francis 仅暴露 CMS preview 时保留 accepted preview，所有合法 preview 降级都输出稳定机器原因。候选循环和保守重试不得覆盖稳定访问门槛；CLI/MCP 批量解析和 lane 排队不得提前消耗 item fetch deadline；HTTP-200 empty shell 只在候选/profile/storage-state 确实变化时重试，相同页面 SHA/状态立即停止；live MCP 只按精确 access-boundary marker 跳过成功 metadata fallback；活动运行时不得包含 FlareSolverr。"
rationale = "Python 包可导入不等于目标浏览器可用，安装时静默联网也会破坏离线包边界；同样，远端挑战、延迟正文或批量调度等待必须与本地 browser context 启动和实际抓取预算分开诊断。"
