[[changes]]
id = "MAC-V4-010"
title = "将稳定发布收敛为不可变源码的产物构建流水线"
area = "ci-release"
status = "implemented"
risk = "P0"
summary = "新增只接收完整 commit SHA 的 reusable package workflow，集中完成 wheel/sdist 构建、精确 inventory、独立安装 smoke、密钥扫描和 Python distributions 上传。普通 CI 继续运行完整 verify 并调用该 workflow；Dependency refresh 继续运行完整 unit；Stable release 只校验 tag/version/SHA，随后以同一 tagged SHA 并行构建 Python distributions 和解析九目标冻结依赖，再构建、验证、汇总、attest 并发布 offline 资产，不运行或等待 unit、coverage、quality、integration、golden 或普通 CI。"
rationale = "稳定发布的职责是从已经由发布操作者本地完整 unit 门禁确认的不可变源码生成并验证发布产物。把普通 CI 的完整测试矩阵再次嵌入 Release 会串行阻塞独立的依赖解析和产物构建，却不会增强 tagged SHA、分发包 inventory、离线 installer、SBOM、checksum 或 attestation 的产物证据。"
implementation_paths = [
  ".github/workflows/ci.yml",
  ".github/workflows/dependency-refresh.yml",
  ".github/workflows/package.yml",
  ".github/workflows/verify.yml",
