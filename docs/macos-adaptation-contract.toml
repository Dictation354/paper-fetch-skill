schema_version = 2
contract_id = "paper-fetch/macos"
contract_version = "4.1.0"
platform = "macos"
change_document = "docs/macos-adaptation-changes.md"
audit_document = "docs/macos-adaptation-audit.md"

[source_baseline]
repository = "https://github.com/Dictation354/paper-fetch-skill"
revision = "fc3bd96e8d781667a2e86e90dc6e8e35a8a26fa7"
version = "4.1.0"

[support.offline]
status = "supported"
minimum_os_version = "15.0"
architectures = ["arm64"]
python_implementation = "CPython"
python_versions = ["3.11", "3.12", "3.13", "3.14"]
python_tags = ["cp311", "cp312", "cp313", "cp314"]
offline_asset_pattern = "paper-fetch-skill-offline-macos-arm64-{python_tag}.tar.gz"
ci_runner = "macos-15"
requires_admin = false
workflow = ".github/workflows/offline.yml"

[support.online]
python_spec = ">=3.11"
formula_tools_location = "platformdirs_user_data"

[build_safety]
python_abi = "standard-gil-cpython"
python_architecture = "must-match-target"
package_name_policy = "single-safe-path-component"
build_directory_policy = "canonical-safe-root"
staging_ownership_marker = ".paper-fetch-offline-staging-owner"
output_directory_policy = "outside-staging"
release_output_policy = "same-filesystem-atomic-rename"
tooling_revision_policy = "optional-full-commit-sha"

[install_safety]
quarantine_scan = "recursive-bundle"
quarantine_error_policy = "fail-closed"
payload_inventory_policy = "exact-checksummed-regular-files-no-symlinks"
host_python_isolation = "all-direct-invocations"
install_target_policy = "missing-empty-or-owned"
ownership_manifest_schema = 3
ownership_runtime_marker = "runtime/python-bin"
purge_symlink_policy = "reject"
purge_path_policy = "validated-normalized-path"
upgrade_preserves = ["offline.env", "user-config-unmanaged-content"]
uninstall_removes_managed_user_config = true

[skill_integrity]
schema_version = 2
aggregate_version = "sha256-of-sorted-path-and-file-sha256"
inventory_policy = "exact-regular-files-no-symlink-or-special"
canonical_agent_manifest = "skills/paper-fetch-skill/agents/openai.yaml"
source_verifier = "src/paper_fetch/skill_integrity.py"
shared_installer = "scripts/_skill_install_common.sh"
check_mode = "strictly-read-only-user-or-project"
doctor_scope = "source-development-or-explicit-installation-to-active-codex"
drift_affects_readiness = true

[components.formula_tools]
delivery = "bundled"
architecture = "arm64"
binary_format = "Mach-O"
signature = "adhoc"
relocate_non_system_dylibs = true
entrypoint = "formula-tools/bin/texmath"
setup_action = "haskell-actions/setup"
setup_action_version = "v2.12.0"
setup_action_sha = "6037f33647c3f17758a2356c80fc4a53d7e0685d"
ghc_version = "9.10.3"
cabal_version = "3.12.1.0"
ci_workflow_uses = 1
offline_workflow_uses = 2
node_package_manifests = [
  "package.json",
  "src/paper_fetch/resources/formula/package.json",
]
node_package_locks = [
  "package-lock.json",
  "src/paper_fetch/resources/formula/package-lock.json",
]
katex_specifier = ">=0.18.4 <0.19.0"
mathml_to_latex_specifier = ">=1.8.0 <2.0.0"
katex_version = "0.18.4"
mathml_to_latex_version = "1.8.0"

[components.camoufox]
python_package = "bundled"
python_package_specifier = ">=0.5.5,<0.6"
version_source = "resolved-wheelhouse"
version_verification = "wheel-installed-manifest"
manifest_version_field = "components.camoufox.python_package_version"
browser_binary = "not_bundled"
runtime_download_during_install = false
browser_binary_prepare_command = "<install>/runtime/paper-fetch-python -m camoufox fetch"
preflight_command = "paper-fetch browser-preflight"
preflight_downloads_browser = "cli-default-enabled-mcp-default-disabled"
auto_prepare_policy = "cli-default-enabled-mcp-library-default-disabled"
auto_prepare_overrides = ["environment", "request"]
managed_runtime_maintenance = ["install", "repair", "update"]
update_check_interval_hours = 24
concurrency_control = "cross-process-file-lock"
prepare_timeout_seconds = 900
prepare_progress = "cli-stderr-mcp-logging"
prepare_cancellation = "cooperative-child-termination"
managed_runtime_resolution = "camoufox-package-managed"
explicit_binary_override = "configured-executable-only"
explicit_binary_auto_prepare = false
native_ci_runtime = "official/152.0.4-beta.28"
native_test_addon_policy = "exclude-default-addons"
native_test_screen_policy = "fixed-synthetic-screen"
route_execution_policy = "compiled-catalog-timeout-retry-qps-acceptance-assets"
storage_state_cache_scope = "actual-use-provider-backend-path-digest"
storage_state_load_diagnostics = "path-exists-used"
main_document_response_diagnostics = "requestfinished-content-length-dom-bytes-navigation-timing-secret-safe"
wiley_http_access_status_review = "401-403-stable-body-exact-doi-no-block-final-fulltext-secret-safe"
binary_asset_transport = "shared-hostname-pool-or-browser-owned-bytes"
asset_budget_defaults = "128-files-32mib-per-asset-256mib-total-64000000-pixels"
asset_worker_policy = "shared-runtime-max4-route-capped-as-completed"
asset_publish_policy = "budgeted-unique-staging-atomic-replace"
asset_route_policy = "explicit-body-assets-20s-direct-timeout-route-cap2"
asset_host_recovery_policy = "article-local-one-direct-probe-per-host-verified-browser-reuse"
asset_observability = "candidate-resolution-per-resource-and-browser-prepare-release-stages"

[native_verifier]
entrypoint = "scripts/verify-offline-package.sh"
archive_extraction = "tarfile-data-filter"
macho_dependency_policy = "canonical-bundle-closure"
reject_absolute_lc_rpath = true
quarantine_before_native_execution = true
node_dependency_check = "otool -L"
node_launch_check = "--version"
covers_recursive_quarantine = true
covers_zsh_symlink = true
covers_user_config = true

[components]
forbidden = ["flaresolverr"]

[components.windows_embedded_cpython]
implementation = "CPython"
architecture = "x86_64"
version = "3.13.13"
archive = "python-3.13.13-embed-amd64.zip"
url = "https://www.python.org/ftp/python/3.13.13/python-3.13.13-embed-amd64.zip"
sha256 = "8766a8775746235e23cf5aee5027ab1060bb981d93110577adcf3508aa0cbd55"
pin_source = "installer/manifest.json"
verification = "sha256-before-extract"
provenance_fields = ["version", "url", "expected_sha256", "actual_sha256"]

[shell]
default = "zsh"
startup_file = ".zshrc"
activation_shells = ["bash", "zsh"]
preserve_startup_symlinks = true

[native_gate]
