title = "为 managed Camoufox 增加受策略控制的首次按需准备"
area = "browser-runtime"
status = "implemented"
risk = "P1"
summary = "安装器继续不捆绑且不下载 browser binary；真实 CLI fetch、auth 与 browser-preflight 默认可按需调用 Camoufox 官方 package manager 安装、修复并每 24 小时检查更新，MCP 和库默认关闭且可由环境或单次请求开启。准备过程使用跨进程文件锁、900 秒预算、CLI stderr/MCP 日志进度与协作取消；显式 custom binary 永不进入 managed runtime 维护。"
rationale = "Windows、Linux 与 macOS 的 Python 包安装成功并不代表 browser binary 已存在。把联网准备放到明确会触发浏览器的入口，同时让自动化入口默认 opt-in，可以避免首次抓取直接失败，也保持安装、静态诊断和受限网络运行模式的可审计边界。"
