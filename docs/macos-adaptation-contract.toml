schema_version = 3
contract_id = "paper-fetch/macos"
platform = "macos"

[support.online]
python_spec = ">=3.11"

[support.offline]
status = "supported"
minimum_os_version = "15.0"
architectures = ["arm64"]
python_implementation = "CPython"
python_versions = ["3.11", "3.12", "3.13", "3.14"]
runner = "macos-15"
requires_admin = false

[evidence.native]
runner = "macos-15"
python_version = "3.14"
release_matrix_workflow = ".github/workflows/offline.yml"
network_smoke_required = false

[safety]
standard_gil_cpython = true
target_architecture_match = true
owned_staging_cleanup = true
atomic_release_publish = true
quarantine_fail_closed = true
exact_payload_inventory = true
reject_symlinks = true
validated_purge_paths = true

[browser]
# 确认同篇正文付费墙后在现有 provider 结果边界停止；正文请求显式携带检查 provider，
# 资产拒绝仍走资产结果；这些 Linux 回放证据不替代原生 macOS gate。
# Provider 的响应选择、请求阻断及临时资产标签复用既有 Camoufox runtime；
# 这些页面策略不改变下列 runtime 分发边界，也不提供原生 macOS 验证证据。
# PNAS 与 Science 仅采用同篇同 URL、出版社主框架已完成导航的最终响应；
# PNAS 每候选正文等待仍受总请求期限约束，不扩大 runtime 或访问权限边界。
# PNAS 原图精确匹配与禁用 preview 只收敛 provider 候选；不新增浏览器执行面。
# IEEE stamp 子 iframe 响应只在同篇官方路径内捕获，沿用 PDF 大小/身份验收；
# stamp 失败后允许同篇文章页的可见 PDF 点击及 popup；Science 引用展开仅用页面可见控件。
# IEEE direct PDF 的 HTTP 502 可进入上述既有浏览器回退，不改变 runtime 或身份验收边界。
# Linux 浏览器回放验证响应契约，不代替 macos-15 原生 runtime gate。
runtime_bundle_built_in = false
core_install_downloads_runtime = false
optional_install_download_requires_consent = true
optional_install_failure_preserves_core = true
managed_runtime_preparation = true
native_bundle_gate = true
# CLI stdin cancellation leaves browser cleanup on the owning request worker.
cooperative_cancel_owner_thread_cleanup = true

[release]
installer_manifest = "installer/manifest.json"
asset_owner = "scripts/prepare_release_assets.py"
single_source_revision = true
public_assets_are_installers_only = true
build_evidence_is_not_public = true
