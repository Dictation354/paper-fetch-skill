[[changes]]
id = "MAC-V4-005"
title = "在写入前约束 quarantine、ownership 与配置安全"
area = "macos-security"
status = "implemented"
risk = "P0"
summary = "构建器和安装器要求 checksum 清单精确覆盖全部 regular file 并拒绝 payload symlink；安装器所有 host Python preflight 使用 isolated mode，并在用户侧写入前递归检查整个 bundle 的 quarantine，检查错误或附加 payload 均 fail closed。只允许缺失、空目录或带 schema 3 ownership manifest 与 runtime marker 的安装目标；purge 拒绝 symlink 入口并只删除已验证的 normalized target，升级保留用户内容。"
rationale = "Gatekeeper、错误递归删除、未授权覆盖和用户配置丢失都可能把可恢复的安装失败升级为用户数据损坏。"
implementation_paths = [
  "install-offline.sh",
  "scripts/build-offline-package.sh",
]
test_nodes = [
