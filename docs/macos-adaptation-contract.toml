[[changes]]
id = "MAC-V4-001"
title = "锁定 v4.1.0 原生矩阵与安全构建输入"
area = "platform-contract"
status = "implemented"
risk = "P0"
summary = "macOS 离线包基于 upstream fc3bd96，只支持 macOS 15、Apple Silicon arm64 和 CPython 3.11 到 3.14 的标准 GIL ABI；构建解释器架构必须匹配目标，包名只能是安全单组件，清理仅限带 ownership marker 的 canonical staging。"
rationale = "在构建清理或用户侧写入之前拒绝路径穿越、危险构建根、未归属 staging、错误系统、架构或非标准 ABI，避免删除越界和产生半安装状态。"
implementation_paths = [
  ".github/workflows/offline.yml",
  "scripts/build-offline-package.sh",
  "install-offline.sh",
]
test_nodes = [
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_package_name_rejects_path_traversal_before_build_cleanup",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_build_rejects_repository_as_build_directory_before_cleanup",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_build_rejects_nonempty_unowned_staging_before_cleanup",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_build_rejects_output_directory_inside_staging",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_build_validates_manifest_derived_package_name",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_release_publish_failure_preserves_existing_artifact",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_macos_build_contract_declares_arm64_minimum_os_and_relocatable_formula_bundle",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_macos_host_below_manifest_minimum_is_rejected_before_writes",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_macos_rejects_rosetta_python_before_writes",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_macos_rejects_nonstandard_cpython_abi_before_writes",
]
