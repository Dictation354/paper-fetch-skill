summary = "常规 CI 保留完整 verify workflow，并与稳定发布分别调用只构建 wheel/sdist 的 package workflow；标签先 peel 到不可变 commit SHA，Release 用同一 SHA 并行构建 Python distributions 与解析九目标冻结依赖，再构建 offline 资产并发布，但不运行或等待远程 unit/普通 CI。固定 macos-15 arm64 runner 验证 cp311-cp314，每个 staged target 同附实际 dependency manifest、CycloneDX SBOM 与固定 SHA 的 provenance；POSIX/Windows builder 分别固定使用 repo-local 锁定 venv 的 Python 生成证据。所有 workflow artifact 扫描显式选择步骤注入的 credential，避免 hosted runner 的无关敏感环境默认值与第三方产物字节偶然匹配。"
