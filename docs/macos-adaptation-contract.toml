schema_version = 3
contract_id = "paper-fetch/macos"
platform = "macos"

[support.online]
python_spec = ">=3.11"

[support.offline]
status = "supported"
minimum_os_version = "15.0"
architectures = ["arm64"]
python_implementation = "CPython"
python_versions = ["3.11", "3.12", "3.13", "3.14"]
runner = "macos-15"
requires_admin = false

[evidence.native]
runner = "macos-15"
python_version = "3.14"
release_matrix_workflow = ".github/workflows/offline.yml"
network_smoke_required = false

[safety]
standard_gil_cpython = true
target_architecture_match = true
owned_staging_cleanup = true
atomic_release_publish = true
quarantine_fail_closed = true
exact_payload_inventory = true
reject_symlinks = true
validated_purge_paths = true

[browser]
# Provider 的响应选择、请求阻断及临时资产标签复用既有 Camoufox runtime；
# 这些页面策略不改变下列 runtime 分发边界，也不提供原生 macOS 验证证据。
runtime_bundle_built_in = false
install_downloads_runtime = false
managed_runtime_preparation = false
native_bundle_gate = true

[release]
installer_manifest = "installer/manifest.json"
asset_owner = "scripts/prepare_release_assets.py"
single_source_revision = true
public_assets_are_installers_only = true
build_evidence_is_not_public = true
