[development_surfaces.wsl]
entrypoint = "scripts/test-macos-contract.sh"
coverage = "contract_and_fake_darwin"
selection = "all_except"
preferred_repo_filesystem = "wsl_linux_filesystem"
shared_windows_checkout = "validator_only"
requires_native_linux_python = true
native_equivalent = false
excluded_test_nodes = [
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_activate_script_is_sourceable_from_macos_default_zsh",
  "tests/integration/test_camoufox_native_macos.py::test_prepared_official_camoufox_bundle_launches_both_context_modes",
]
exclusion_reason = "These nodes execute native /bin/zsh or a prepared Darwin arm64 Camoufox app bundle. WSL/Linux can validate source, mocks, and fake-Darwin decisions, but cannot turn local substitutes into native macOS evidence."

[[changes]]
id = "MAC-V4-001"
title = "锁定 v4.1.0 原生矩阵与安全构建输入"
area = "platform-contract"
status = "implemented"
risk = "P0"
summary = "macOS 离线包基于 upstream fc3bd96，只支持 macOS 15、Apple Silicon arm64 和 CPython 3.11 到 3.14 的标准 GIL ABI；构建解释器架构必须匹配目标，包名只能是安全单组件，清理仅限带 ownership marker 的 canonical staging。"
rationale = "在构建清理或用户侧写入之前拒绝路径穿越、危险构建根、未归属 staging、错误系统、架构或非标准 ABI，避免删除越界和产生半安装状态。"
implementation_paths = [
  ".github/workflows/offline.yml",
  "scripts/build-offline-package.sh",
  "install-offline.sh",
]
test_nodes = [
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_package_name_rejects_path_traversal_before_build_cleanup",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_build_rejects_repository_as_build_directory_before_cleanup",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_build_rejects_nonempty_unowned_staging_before_cleanup",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_build_rejects_output_directory_inside_staging",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_build_validates_manifest_derived_package_name",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_release_publish_failure_preserves_existing_artifact",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_macos_build_contract_declares_arm64_minimum_os_and_relocatable_formula_bundle",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_macos_host_below_manifest_minimum_is_rejected_before_writes",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_macos_rejects_rosetta_python_before_writes",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_macos_rejects_nonstandard_cpython_abi_before_writes",
]
audit_cases = ["MAC-AUD-001", "MAC-AUD-002", "MAC-AUD-003"]
portable_validation = "static_and_simulated"
native_validation_required = true

[[changes]]
id = "MAC-V4-002"
title = "生成可迁移、可签名且可启动的原生工具"
area = "native-packaging"
status = "implemented"
risk = "P0"
summary = "构建器收集并重定位非系统 dylib，记录 macOS deployment target，对 texmath 及其依赖执行 ad-hoc 签名；verifier 用安全 tar filter、canonical Mach-O 闭包和 LC_RPATH 检查后才启动 Playwright Node。"
rationale = "不能让恶意归档路径、Homebrew 构建机绝对依赖、bundle 外链接或不可启动的 Node/Mach-O 泄漏进发布包。"
implementation_paths = [
  "scripts/build-offline-package.sh",
  "scripts/verify-offline-package.sh",
]
test_nodes = [
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_macos_build_contract_declares_arm64_minimum_os_and_relocatable_formula_bundle",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_macos_offline_verifier_uses_zsh_and_native_formula_checks",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_macos_binary_checks_do_not_accept_arm64_from_path_text",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_offline_verifier_rejects_malicious_tar_members_before_extraction",
]
audit_cases = ["MAC-AUD-004", "MAC-AUD-005", "MAC-AUD-006"]
portable_validation = "static"
native_validation_required = true

[[changes]]
id = "MAC-V4-003"
title = "明确 Camoufox 离线边界并移除 FlareSolverr"
area = "browser-runtime"
status = "implemented"
risk = "P1"
summary = "browser/full extra 允许兼容的 Camoufox 0.5.x，并由 uv.lock 选择可复现的具体版本；构建器复核下载 wheel metadata 与 installed distribution，并在 manifest 记录该版本。离线包捆绑 Python 包但不捆绑浏览器 binary，安装器不得下载浏览器，用户须先显式执行 camoufox fetch，再用 browser-preflight 验证。selected-browser 页面等待稳定正文 DOM；快速 attempt 的稳定访问门槛不会被保守重试超时覆盖；活动运行时不得包含 FlareSolverr。"
rationale = "Python 包可导入不等于目标浏览器可用，安装时静默联网也会破坏离线包边界；同样，远端挑战或延迟正文必须与本地 browser context 启动失败分开诊断。"
implementation_paths = [
  "pyproject.toml",
  "uv.lock",
  "scripts/build-offline-package.sh",
  "install-offline.sh",
  "src/paper_fetch/browser_preflight.py",
  "src/paper_fetch/extraction/html/signals.py",
  "src/paper_fetch/providers/browser_workflow/html_extraction.py",
  "src/paper_fetch/providers/browser_workflow/fetchers/readiness.py",
  "src/paper_fetch/providers/mdpi.py",
  "src/paper_fetch/quality/html_availability.py",
]
test_nodes = [
  "tests/unit/test_fetch_common.py::FetchCommonTests::test_browser_extras_allow_locked_compatible_camoufox_api_version",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_build_enforces_locked_camoufox_runtime_version",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_manifest_records_verified_camoufox_version",
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_manifest_and_readme_document_browser_backend_policy",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_installers_do_not_call_playwright_browser_install",
  "tests/unit/test_browser_preflight.py::test_static_browser_capabilities_never_claims_live_health",
  "tests/unit/test_html_access_signals.py::HtmlAccessSignalsTests::test_detect_html_block_classifies_nature_client_challenge_shell",
  "tests/unit/test_provider_request_options.py::ProviderRequestOptionsTests::test_browser_workflow_preserves_fast_access_gate_when_retry_times_out",
  "tests/unit/test_runtime_deadline_and_readiness.py::test_aip_science_and_mdpi_publish_current_body_readiness_selectors",
  "tests/unit/test_atypon_browser_workflow_candidates.py::AtyponBrowserWorkflowCandidateTests::test_pnas_and_mdpi_use_headless_fulltext_readiness_selectors",
]
audit_cases = ["MAC-AUD-012"]
portable_validation = "static"
native_validation_required = false

[[changes]]
id = "MAC-V4-004"
title = "采用 Zsh 与 macOS platformdirs 布局"
area = "shell-and-filesystem"
status = "implemented"
risk = "P1"
summary = "安装器支持默认 Zsh、从任意目录 source 激活脚本、保留 startup symlink，把用户配置写到 platformdirs 对应的 Application Support 目录，并让 MCP cache scope 接受 /var 与 /private/var 或 /tmp 与 /private/tmp 等价根路径；该 alias 行为由原生 macOS CI 精确测试。"
rationale = "macOS 默认 shell、用户目录和系统路径别名语义不能沿用 Linux XDG/Bash 与单一绝对路径假设。"
implementation_paths = [
  "install-offline.sh",
  "src/paper_fetch/config.py",
  "src/paper_fetch/mcp/cache_index.py",
]
test_nodes = [
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_macos_user_config_uses_application_support",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_zsh_startup_symlink_is_preserved",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_activate_script_is_sourceable_from_macos_default_zsh",
  "tests/unit/test_cache_index_semantics.py::CacheIndexSemanticsTests::test_cache_scope_accepts_equivalent_filesystem_alias_for_root",
]
audit_cases = ["MAC-AUD-008", "MAC-AUD-010"]
portable_validation = "static_and_simulated"
native_validation_required = true

[[changes]]
id = "MAC-V4-005"
title = "在写入前约束 quarantine、ownership 与配置安全"
area = "macos-security"
status = "implemented"
risk = "P0"
summary = "构建器和安装器要求 checksum 清单精确覆盖全部 regular file 并拒绝 payload symlink；安装器所有 host Python preflight 使用 isolated mode，并在用户侧写入前递归检查整个 bundle 的 quarantine，检查错误或附加 payload 均 fail closed。只允许缺失、空目录或带 schema 3 ownership manifest 与 runtime marker 的安装目标；purge 拒绝 symlink 入口并只删除已验证的 normalized target，升级保留用户内容。"
rationale = "Gatekeeper、错误递归删除、未授权覆盖和用户配置丢失都可能把可恢复的安装失败升级为用户数据损坏。"
implementation_paths = [
  "install-offline.sh",
  "scripts/build-offline-package.sh",
]
test_nodes = [
  "tests/unit/test_offline_package_build.py::OfflinePackageBuildTests::test_posix_checksum_inventory_rejects_payload_symlinks",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_unlisted_runtime_payload_is_rejected_before_bundled_python_runs",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_unlisted_top_level_sitecustomize_is_rejected_before_host_python_import",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_purge_normalizes_owned_dot_path_before_deletion",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_purge_rejects_owned_symlink_before_removing_integrations",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_macos_quarantine_fails_before_user_writes",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_macos_xattr_inspection_error_fails_closed_before_user_writes",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_install_rejects_home_before_removing_existing_content",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_install_rejects_nonempty_unowned_directory",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_install_rejects_symlink_to_nonempty_unowned_directory",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_install_dir_upgrade_cleans_old_payload_and_preserves_offline_env",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_macos_user_config_uses_application_support",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_purge_rejects_home_before_removing_integrations",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_purge_requires_install_marker_for_every_owned_target",
  "tests/unit/test_offline_install.py::OfflineInstallTests::test_zsh_startup_symlink_is_preserved",
]
audit_cases = ["MAC-AUD-007", "MAC-AUD-009", "MAC-AUD-010"]
portable_validation = "static_and_simulated"
