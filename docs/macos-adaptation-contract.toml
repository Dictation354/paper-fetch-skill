[[changes]]
id = "MAC-V4-007"
title = "建立 Windows/WSL 可执行但不冒充原生证据的维护契约"
area = "cross-platform-maintenance"
status = "implemented"
risk = "P1"
summary = "机器可读 TOML 映射精确 pytest node；普通 CI 在 Ubuntu 与 Windows 运行 portable gate，WSL 使用原生 Linux Python 并把 /mnt checkout 降级为 validator-only。不可变标签重跑必须先通过 source contract，POSIX/Windows tooling ref 都要求完整 SHA，只复制精确同名工具路径而不复制 Python wheel source，并记录 tooling revision。"
rationale = "主开发环境可以尽早发现契约漂移，但必须清楚保留原生 macOS 发布 gate 的证据边界，并避免工具链修复悄然改变不可变标签的业务源码。"
implementation_paths = [
  "docs/macos-adaptation-contract.toml",
  "scripts/validate_macos_adaptation.py",
  "scripts/test-macos-contract.ps1",
  "scripts/test-macos-contract.sh",
  ".gitattributes",
  ".github/workflows/ci.yml",
  ".github/workflows/offline.yml",
  "scripts/build-offline-package-windows.ps1",
]
test_nodes = [
