schema_version = 3
contract_id = "paper-fetch/macos"
platform = "macos"

[support.online]
python_spec = ">=3.11"

[support.offline]
status = "supported"
minimum_os_version = "15.0"
architectures = ["arm64"]
python_implementation = "CPython"
python_versions = ["3.11", "3.12", "3.13", "3.14"]
runner = "macos-15"
requires_admin = false

[evidence.native]
# Shared-browser gates reuse prepared dependency caches and cap GPU-probing
# browser launches at two pytest workers; publisher state stays isolated.
runner = "macos-15"
python_version = "3.14"
release_matrix_workflow = ".github/workflows/offline.yml"
network_smoke_required = false

[safety]
standard_gil_cpython = true
target_architecture_match = true
owned_staging_cleanup = true
atomic_release_publish = true
quarantine_fail_closed = true
exact_payload_inventory = true
reject_symlinks = true
validated_purge_paths = true

[skills.codex]
user_directory = "~/.agents/skills/paper-fetch-skill"
project_directory = ".agents/skills/paper-fetch-skill"
verify_before_legacy_cleanup = true
check_is_read_only = true

[browser]
byparr_version = "3.1.1"
native_engine = "camoufox"
default_backend = "byparr"
pnas_backend = "byparr"
elsevier_browser_routes = "supported"
system_chrome_required = false
installer_prepares_byparr = true
runtime_bundle_built_in = false
core_install_downloads_runtime = true
optional_install_download_requires_consent = false
optional_install_failure_preserves_core = true
managed_runtime_preparation = true
fingerprint_model_github_api_fallback = true
fingerprint_model_before_playwright = true
fetch_start_preparation = false
on_demand_preparation = true
success_only_update_interval = true
installer_prepares_camoufox = true
installer_skip_browser_prepare = true
installer_preparation_single_pass = true
batch_prepares_once = true
update_check_interval_seconds = 86400
default_channel = "official/prerelease"
prerelease_includes_stable = true
python_package_spec = "camoufox==0.5.9"
native_bundle_gate = true
cooperative_cancel_owner_thread_cleanup = true
html_snapshot_owner_thread = true
supplementary_index_without_body = true
publisher_native_persistent_profiles = true
profile_exclusive_lock_owner_thread = true
auth_native_profile_replay = true
json_export_optional = true

[release]
installer_manifest = "installer/manifest.json"
asset_owner = "scripts/prepare_release_assets.py"
single_source_revision = true
public_assets_are_installers_only = true
build_evidence_is_not_public = true

[update]
command = "paper-fetch update"
repository = "Dictation354/paper-fetch-skill"
official_installation_only = true
stable_release_only = true
sha256_before_execute = true
archive_preflight = true
reuse_offline_installer_checks = true
staged_payload_validation = true
runtime_failure_rollback = true
validation_before_runtime_commit = true
