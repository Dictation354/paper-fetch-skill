id = "MAC-V4-008"
title = "让 Camoufox 自行解析官方 macOS app bundle"
area = "browser-runtime"
status = "implemented"
risk = "P1"
summary = "默认 managed runtime 只用 download_if_missing=false 做就绪检查，不再把官方 app 的 MacOS executable 重新作为 custom executable_path 传回 Camoufox；显式配置的 binary override 仍原样传递，普通抓取和持久 auth context 使用同一规则。"
rationale = "Camoufox 0.5.4 的官方 Mac bundle 把 executable 放在 Contents/MacOS、properties.json 放在 Contents/Resources；把 managed executable 当 custom path 会错误查找 Contents/MacOS/properties.json，使原生 preflight 在浏览器创建前失败。"
