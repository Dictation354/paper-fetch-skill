route_contract:
  article_html:
    success_requires:
      - Browser-rendered Taylor & Francis Online page exposes DOI or title metadata
      - A provider article container contains abstract plus body sections
      - Body content appears before references, metrics, related-content, or recommendation
        chrome
    reject_if_any:
      - Cloudflare or CAPTCHA challenge page
      - sign-in or purchase access gate without article body
      - site navigation only
      - empty article shell
    min_body_chars: 1200
    min_body_sections: 1
    notes: Direct HTTP probes returned Cloudflare challenge wrappers in the current
      environment, so the approved primary route uses the existing Camoufox browser
      runtime and never treats a challenge response as article HTML.
  pdf_fallback:
    success_requires:
      - Browser-seeded navigation uses a Taylor & Francis /doi/pdf/ or /doi/epdf/
        route
      - PDF response has application/pdf content type or PDF magic bytes
      - Shared PDF extraction produces body text
    reject_if_any:
      - HTML wrapper
      - Cloudflare or CAPTCHA challenge page
      - sign-in or purchase access gate
      - error page
    require_pdf_magic: true
    reject_html_wrapper: true
    notes: PDF is a text-first fallback; HTML remains preferred for body figures,
      tables, MathML formulas, references, and supplementary links.
  abstract_only:
    success_requires:
      - Provider page or metadata exposes a non-empty abstract
      - Source trail marks abstract-only degradation after HTML and PDF rejection
    reject_if_any:
      - fabricated body text
      - challenge page
      - full-text body misclassified as abstract-only
  metadata_only:
    success_requires:
      - metadata contains DOI or title
      - source trail marks metadata-only fallback
    reject_if_any:
      - fabricated body text
      - provider-specific fulltext source without fulltext
markdown_contract:
  structure:
    doi: 10.1080/15481603.2026.2667034
    must_include:
      - '## Abstract'
      - '## 1. Introduction'
    must_not_include:
