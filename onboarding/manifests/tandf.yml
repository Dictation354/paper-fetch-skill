    must_not_include:
      - Google Scholar
      - Display Table
    must_match:
      - (?m)^\|.+\|$
  formula:
    doi: 10.1080/08839514.2024.2375110
    must_include:
      - '## Introduction'
    must_not_include:
      - '[Formula unavailable]'
      - MathJax Logo
    must_match:
