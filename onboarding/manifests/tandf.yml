    must_include:
      - '## References'
    must_not_include:
      - Google Scholar
      - Article Metrics
  pdf_fallback:
    doi: 10.1080/15481603.2026.2667034
    must_include:
      - Quantifying cumulative heat effects
    must_not_include:
      - Just a moment
      - Access Denied
