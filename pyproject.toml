[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-fetch-skill"
version = "6.1.3"
description = "AI-friendly paper fetch tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jifei Huang" },
]
maintainers = [
  { name = "Jifei Huang" },
]
keywords = ["papers", "markdown", "doi", "mcp", "research"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "cachetools>=6,<8",
  "defusedxml>=0.7.1,<0.8",
  "filetype>=1.2,<2",
  "filelock>=3.20,<4",
  "imagesize>=1.4,<3",
  "idutils>=1.5,<2",
  "mcp>=2,<3",
  "platformdirs>=4,<5",
  "python-dotenv>=1.2,<2",
  "rapidfuzz>=3,<4",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "urllib3>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/Dictation354/paper-fetch-skill"
Documentation = "https://github.com/Dictation354/paper-fetch-skill/tree/main/docs"
Repository = "https://github.com/Dictation354/paper-fetch-skill"
Issues = "https://github.com/Dictation354/paper-fetch-skill/issues"
Changelog = "https://github.com/Dictation354/paper-fetch-skill/blob/main/CHANGELOG.md"

[project.optional-dependencies]
browser = [
  "camoufox>=0.5.5,<0.6",
  "lxml>=6,<7",
  "playwright>=1.47,<1.61",
  "trafilatura>=2.0,<3",
]
pdf = [
  "PyMuPDF>=1.27,<2",
  "pymupdf4llm>=1.28.2,<2",
]
full = [
  "camoufox>=0.5.5,<0.6",
  "lxml>=6,<7",
  "playwright>=1.47,<1.61",
  "PyMuPDF>=1.27,<2",
  "pymupdf4llm>=1.28.2,<2",
  "trafilatura>=2.0,<3",
]
dev = [
  "cyclonedx-bom>=7,<8",
  "jsonschema>=4,<5",
  "markdown-it-py>=3,<5",
  "packaging>=24,<27",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "pytest-socket>=0.7,<1",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.8,<1",
  "mypy>=1.14,<3",
]

[project.scripts]
paper-fetch = "paper_fetch.cli:main"
paper-fetch-mcp = "paper_fetch.mcp.server:main"
paper-fetch-install-formula-tools = "paper_fetch.formula.install:main"
paper-fetch-install-image-tools = "paper_fetch.image_tools.install:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper_fetch*"]
exclude = ["paper_fetch.resources.formula.node_modules*"]

[tool.setuptools.package-data]
"paper_fetch.resources.arxiv" = ["*.json"]
"paper_fetch.resources.formula" = ["*.json", "*.mjs"]
"paper_fetch.resources.journal_routes" = ["*.json"]
"paper_fetch.resources.manifest" = ["*.json"]
"paper_fetch.models" = ["*.pyi"]

[tool.setuptools.data-files]
"share/paper-fetch-skill/skills/paper-fetch-skill" = ["skills/paper-fetch-skill/SKILL.md"]
"share/paper-fetch-skill/skills/paper-fetch-skill/agents" = ["skills/paper-fetch-skill/agents/openai.yaml"]
"share/paper-fetch-skill/skills/paper-fetch-skill/references" = ["skills/paper-fetch-skill/references/*.md"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "TID251", "UP", "RUF022", "SIM105", "B"]
# B008: default_mcp_deps() in argument defaults is an intentional dependency-injection
# seam (overridden in tests), not the mutable-default footgun the rule targets.
ignore = ["B008"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"paper_fetch.providers._article_markdown".msg = "Removed compatibility module; import the canonical provider or extraction owner instead."
"paper_fetch.providers._ams_html".msg = "Removed compatibility module; import the matching canonical AMS owner (_ams_dom, _ams_markdown, _ams_assets, _ams_authors, or _ams_references) instead."
"paper_fetch.providers._html_access_signals".msg = "Removed compatibility module; import paper_fetch.extraction.html.signals or paper_fetch.quality owners instead."
"paper_fetch.providers._html_availability".msg = "Removed compatibility module; import paper_fetch.quality.html_availability instead."
"paper_fetch.providers._html_citations".msg = "Removed compatibility module; import paper_fetch.markdown.citations or provider reference owners instead."
"paper_fetch.providers._html_semantics".msg = "Removed compatibility module; import paper_fetch.extraction.html.semantics instead."
"paper_fetch.providers._html_tables".msg = "Removed compatibility module; import paper_fetch.extraction.html.tables instead."
"paper_fetch.providers._html_text".msg = "Removed compatibility module; import paper_fetch.extraction.html shared/runtime owners instead."
"paper_fetch.providers._language_filter".msg = "Removed compatibility module; import paper_fetch.extraction.html.language instead."
"paper_fetch.providers._mdpi_html".msg = "Removed compatibility module; import the matching canonical MDPI owner (_mdpi_dom, _mdpi_markdown, _mdpi_assets, _mdpi_authors, or _mdpi_references) instead."
"paper_fetch.providers._springer_references".msg = "Removed compatibility module; import paper_fetch.providers._html_references instead."
"paper_fetch.providers._atypon_browser_workflow".msg = "Removed compatibility module; import paper_fetch.providers.browser_workflow instead."
"paper_fetch.providers._atypon_browser_workflow_html".msg = "Removed compatibility module; import paper_fetch.providers.browser_workflow.html_extraction instead."
"paper_fetch.providers.html_assets".msg = "Removed compatibility module; import paper_fetch.extraction.html.assets instead."
"paper_fetch.providers.pnas_html".msg = "Removed compatibility module; import paper_fetch.providers._pnas_html instead."
"paper_fetch.providers.science_html".msg = "Removed compatibility module; import paper_fetch.providers._science_html instead."
"paper_fetch.providers.springer_html".msg = "Removed compatibility module; import the matching canonical Springer owner (_springer_dom, _springer_markdown, _springer_assets, _springer_authors, or _html_references) instead."
"paper_fetch.providers.wiley_html".msg = "Removed compatibility module; import paper_fetch.providers._wiley_html instead."
"paper_fetch.extraction.html._assets".msg = "Removed compatibility module; import paper_fetch.extraction.html.assets instead."
"paper_fetch.resolve.crossref".msg = "Removed compatibility module; import paper_fetch.metadata.crossref instead."

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/paper_fetch"]
check_untyped_defs = true
ignore_missing_imports = true
no_site_packages = true
warn_unused_ignores = true

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-args = 10

[tool.pytest.ini_options]
addopts = "-n auto --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1"
testpaths = [
  "tests/unit",
  "tests/integration",
]
