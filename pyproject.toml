[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-fetch-skill"
version = "8.2.2"
description = "AI-friendly paper fetch tooling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Jifei Huang" },
]
maintainers = [
  { name = "Jifei Huang" },
]
keywords = ["papers", "markdown", "doi", "cli", "research"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "cachetools>=6,<9",
  "defusedxml>=0.7.1,<0.8",
  "filetype>=1.2,<2",
  "filelock>=3.20,<5",
  "imagesize>=1.4,<3",
  "idutils>=1.5,<2",
  "platformdirs>=4,<5",
  "python-dotenv>=1.2,<2",
  "rapidfuzz>=3,<4",
  "pydantic>=2,<3",
  "PyYAML>=6,<7",
  "urllib3>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/Dictation354/paper-fetch-skill"
Documentation = "https://github.com/Dictation354/paper-fetch-skill/tree/main/docs"
Repository = "https://github.com/Dictation354/paper-fetch-skill"
Issues = "https://github.com/Dictation354/paper-fetch-skill/issues"
Changelog = "https://github.com/Dictation354/paper-fetch-skill/blob/main/CHANGELOG.md"

[project.optional-dependencies]
browser = [
  "httpx>=0.28,<1",
  "camoufox==0.5.9; (sys_platform != 'linux' and sys_platform != 'win32') or (platform_machine != 'x86_64' and platform_machine != 'AMD64' and platform_machine != 'amd64')",
  "lxml>=6,<7",
  "playwright>=1.58,<1.63; (sys_platform != 'linux' and sys_platform != 'win32') or (platform_machine != 'x86_64' and platform_machine != 'AMD64' and platform_machine != 'amd64')",
  "playwright>=1.58,<2; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'amd64')",
  "invisible-playwright==0.58.0; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'amd64')",
  "invisible-core==69.82.0; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'amd64')",
  "trafilatura>=2.4,<3",
]
pdf = [
  "PyMuPDF>=2,<3",
  "pymupdf4llm>=2,<3",
]
full = [
  "httpx>=0.28,<1",
  "camoufox==0.5.9; (sys_platform != 'linux' and sys_platform != 'win32') or (platform_machine != 'x86_64' and platform_machine != 'AMD64' and platform_machine != 'amd64')",
  "lxml>=6,<7",
  "playwright>=1.58,<1.63; (sys_platform != 'linux' and sys_platform != 'win32') or (platform_machine != 'x86_64' and platform_machine != 'AMD64' and platform_machine != 'amd64')",
  "playwright>=1.58,<2; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'amd64')",
  "invisible-playwright==0.58.0; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'amd64')",
  "invisible-core==69.82.0; (sys_platform == 'linux' or sys_platform == 'win32') and (platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'amd64')",
  "PyMuPDF>=2,<3",
  "pymupdf4llm>=2,<3",
  "trafilatura>=2.4,<3",
]
dev = [
  "cyclonedx-bom>=7,<10",
  "jsonschema>=4,<5",
  "markdown-it-py>=3,<5",
  "packaging>=24,<27",
  "pip-audit>=2.9,<3",
  "pytest>=8,<10",
  "pytest-socket>=0.7,<1",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.8,<1",
  "mypy>=1.14,<3",
]

[project.scripts]
paper-fetch = "paper_fetch.cli:main"
paper-fetch-install-formula-tools = "paper_fetch.formula.install:main"
paper-fetch-install-image-tools = "paper_fetch.image_tools.install:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper_fetch*"]
exclude = ["paper_fetch.resources.formula.node_modules*"]

[tool.setuptools.package-data]
"paper_fetch.resources.arxiv" = ["*.json"]
"paper_fetch.resources.formula" = ["*.json", "*.mjs"]
"paper_fetch.resources.journal_routes" = ["*.json"]
"paper_fetch.resources.manifest" = ["*.json"]
"paper_fetch.models" = ["*.pyi"]
"paper_fetch.providers.browser_runtime" = ["byparr-manifest.json", "byparr-requirements.lock", "byparr_server.cjs", "byparr-adaptation.md"]

[tool.setuptools.data-files]
"share/paper-fetch-skill/skills/paper-fetch-skill" = ["skills/paper-fetch-skill/SKILL.md"]
"share/paper-fetch-skill/skills/paper-fetch-skill/agents" = ["skills/paper-fetch-skill/agents/openai.yaml"]
"share/paper-fetch-skill/skills/paper-fetch-skill/references" = ["skills/paper-fetch-skill/references/*.md"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF022", "SIM105", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/paper_fetch"]
check_untyped_defs = true
ignore_missing_imports = true
no_site_packages = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-n auto --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1"
testpaths = [
  "tests/unit",
  "tests/integration",
]
