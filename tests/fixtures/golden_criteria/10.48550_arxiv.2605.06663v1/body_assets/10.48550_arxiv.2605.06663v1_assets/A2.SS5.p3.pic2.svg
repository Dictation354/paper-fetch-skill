<span class="ltx_p" id="A2.SS5.p3.pic2.2.2.2.1.1.1"><span class="ltx_text" id="A2.SS5.p3.pic2.2.2.2.1.1.1.1" style="font-size:90%;">Harry slept 9 hours. His friend James slept 2/3 of 9. So 2/3 of 9 is 6. So the answer is 6 more hours. 9 - 6 = 3. So the answer is 3.</span></span>
