  - key: mdpi:access_block
    reviewed_at: 2026-07-28
    expires_at: 2026-10-31
    reason: MDPI invalid-shell rejection is unit-tested, but no stable approved real block replay is checked in.
  - key: royalsocietypublishing:access_block
    reviewed_at: 2026-07-28
    expires_at: 2026-10-31
    reason: Royal Society access rejection is unit-tested, but no stable approved block replay is checked in.
  - key: copernicus:xml_empty_or_abstract
    reviewed_at: 2026-07-28
    expires_at: 2026-10-31
    reason: Copernicus empty-body XML is rejected by unit contracts, but no real negative XML replay is checked in.
  - key: elsevier:xml_empty_or_abstract
    reviewed_at: 2026-07-28
    expires_at: 2026-10-31
